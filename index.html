      <label for="ph_${p.key}">${PHOTOS[p.key] ? "Change photo" : "Add photo"}</label>
      <input type="file" accept="image/*" id="ph_${p.key}" data-photo="${p.key}">
      ${PHOTOS[p.key] ? `<button class="linkbtn" data-unphoto="${p.key}">Remove photo</button>` : ""}
      ${p.guest ? `<button class="linkbtn" data-unguest="${p.key}">Remove player</button>` : ""}</div>`).join("") +
      `<form class="addguest" id="addGuest"><input class="field" id="guestName" placeholder="Add a guest player" maxlength="30" autocomplete="off">
        <button class="btn primary" type="submit">Add</button></form>`;
    $("#addGuest", el).addEventListener("submit", async e=>{
      e.preventDefault();
      const n = $("#guestName", el).value.trim(); if(!n) return;
      if(LEAGUE_KEYS.indexOf(slug(n))!==-1){ toast(n + " is already in the league."); return; }
      try{ await saveGuest(n); paintPlayers(); toast(n + " added as a guest."); }
      catch(err){ toast("Couldn't add them: " + err.message); }
    });
    el.querySelectorAll("[data-unguest]").forEach(b=>b.addEventListener("click", async ()=>{
      const k = b.dataset.unguest;
      if(!confirm(`Remove ${GUESTS[k]} from the player list? Picks they've already made stay on those shows.`)) return;
      try{ await initDb(); await withinMs(db.ref(PLAYER_PATH+"/"+k).remove(), 10000); delete GUESTS[k]; delete PHOTOS[k]; paintPlayers(); }
      catch(err){ toast("Couldn't remove them: " + err.message); }
    }));
    el.querySelectorAll("[data-photo]").forEach(inp=>inp.addEventListener("change", async ()=>{
      const f = inp.files && inp.files[0]; if(!f) return;
      try{
        const data = await resizePhoto(f);
        await initDb();
        await withinMs(db.ref(PLAYER_PATH+"/"+inp.dataset.photo).update({ photo:data, updatedAt:firebase.database.ServerValue.TIMESTAMP }), 15000);
        PHOTOS[inp.dataset.photo] = data; paintPlayers(); toast("Photo saved.");
      }catch(e){ toast("The photo didn't save: " + e.message); }
    }));
    el.querySelectorAll("[data-unphoto]").forEach(b=>b.addEventListener("click", async ()=>{
      try{ await initDb(); const k = b.dataset.unphoto;
        await withinMs(GUESTS[k] ? db.ref(PLAYER_PATH+"/"+k+"/photo").remove() : db.ref(PLAYER_PATH+"/"+k).remove(), 10000); delete PHOTOS[k]; paintPlayers(); }
      catch(e){ toast("Couldn't remove the photo: " + e.message); }
    }));
  };
  view = { repaint: paintPlayers };
  paintPlayers();
  initDb().catch(()=>{});
  const events = await allEvents().catch(()=>[]);
  const el = $("#setupShows"); if(!el) return;
  el.innerHTML = events.length ? events.map(e=>`<a class="ev" href="#/setup/${esc(e.id)}">
      <span class="swatch" style="background:${THEME_SWATCH[e.theme]||"var(--accent)"}"></span>
      <span><span class="t">${esc(e.name)}${e.subtitle?" "+esc(e.subtitle):""}</span>
      <span class="m" style="display:block">${esc(e.promotion||"")} · ${esc(fmtDate(e.start,{weekday:"short",month:"short",day:"numeric"}))}${e.edited?" · edited here":""}</span></span>
      <span class="s"><b>Edit</b></span></a>`).join("") : `<div class="empty">No shows yet. Add one below.</div>`;
}

function blankShow(){
  const d = new Date(); d.setDate(d.getDate() + ((6 - d.getDay() + 7) % 7 || 7)); d.setHours(17,0,0,0);
  return { id:"", name:"", subtitle:"", promotion:"WWE", start:fromLocalInput(toLocalInput(d.toISOString())), venue:"", theme:"ringside",
    bouts:[{ id:"", title:"", stip:"", options:[{n:""},{n:""}] }], bonus:[], roster:[] };
}

async function setupEditor(app, id){
  const isNew = id==="new";
  app.innerHTML = `<div class="setup"><div class="empty" style="margin-top:24px">Loading…</div></div>`;
  let original = null, inRepo = false, inFb = false;
  if(!isNew){
    const repoIdx = await loadIndex().catch(()=>[]);
    inRepo = repoIdx.some(e=>e.id===id);
    let fb = null;
    try{ await initDb(); const v = (await withinMs(db.ref(CARD_PATH+"/"+id).once("value"), 8000)).val(); fb = v ? parseDef(v) : null; }catch(e){}
    inFb = !!fb && !fb.deleted;
    original = (inFb ? fb : null) || await getJSON("events/"+id+".json").catch(()=>null);
    if(!original){ app.innerHTML = `<div class="empty" style="margin-top:24px">There's no show called “${esc(id)}”. <a href="#/setup">Back to setup</a>.</div>`; return; }
  }
  const D = JSON.parse(JSON.stringify(original || blankShow()));
  if(!D.id) D.id = isNew ? "" : id;
  D.bouts = D.bouts || []; D.bonus = D.bonus || [];
  D.bouts.forEach(b=>b.options.forEach(o=>{ o._k = o.n; }));     // remember names, to carry picks over a rename
  let dirty = false;

  app.innerHTML = `<div class="setup"><h1 id="edTitle"></h1><p class="lede">Changes go live for everyone as soon as you save. Ryan's picks come from RyAI — ask Claude to run it once the card is set.</p><div id="ed"></div>
    <div class="savebar"><span class="msg" id="saveMsg"></span>
      <a class="btn" href="${isNew ? "#/setup" : "#/"+esc(id)}" style="text-decoration:none">${isNew?"Cancel":"View show"}</a>
      <button class="btn primary" id="saveBtn">Save</button></div></div>`;
  const ed = $("#ed");

  const txt = (path, label, ph, type)=>`<div class="fld"><label class="lab" for="f_${path}">${label}</label>
    <input class="field" id="f_${path}" data-path="${path}" ${type==="num"?'type="number" data-kind="num"':'type="text"'} value="${esc(getPath(D,path) ?? "")}" placeholder="${esc(ph||"")}"></div>`;
  const chk = (path, label)=>`<label class="check"><input type="checkbox" data-path="${path}" data-kind="bool" ${getPath(D,path)?"checked":""}>${label}</label>`;

  function paint(){
    $("#edTitle").textContent = isNew ? "New show" : (D.name || "Untitled show");
    let h = `<h2>The show</h2><div class="panel">
      <div class="grid2">${txt("name","Show name","Survivor Series")}${txt("subtitle","Second line (optional)","Minneapolis")}</div>
      <div class="grid2">${txt("promotion","Promotion","WWE")}
        <div class="fld"><label class="lab" for="f_start">Bell time (picks lock)</label><input class="field" id="f_start" type="datetime-local" data-kind="start" value="${esc(toLocalInput(D.start))}"></div></div>
      <div class="grid2">${txt("venue","Venue (optional)","")}
        <div class="fld"><label class="lab" for="f_theme">Look</label><select class="field" id="f_theme" data-path="theme">${THEMES.map(([v,l])=>`<option value="${v}" ${D.theme===v?"selected":""}>${esc(l)}</option>`).join("")}</select></div></div>
    </div>`;

    h += `<h2>Matches</h2>`;
    D.bouts.forEach((b,i)=>{
      h += `<div class="panel"><div class="mhead"><span class="ttl">Match ${i+1}</span>
        <button class="iconbtn" data-act="up" data-list="bouts" data-i="${i}" ${i===0?"disabled":""} aria-label="Move up">↑</button>
        <button class="iconbtn" data-act="down" data-list="bouts" data-i="${i}" ${i===D.bouts.length-1?"disabled":""} aria-label="Move down">↓</button>
        <button class="iconbtn" data-act="del" data-list="bouts" data-i="${i}">Remove</button></div>
        ${txt(`bouts.${i}.title`,"Match title","Intercontinental Championship")}
        ${txt(`bouts.${i}.stip`,"Stipulation or note (optional)","Ladder match")}
        <div class="fld">${chk(`bouts.${i}.ladder`,"Show as a ladder")}${chk(`bouts.${i}.allowOther`,"Allow a surprise winner")}</div>
        <span class="lab">Entrants · tick the champion</span>`;
      b.options.forEach((o,j)=>{
        h += `<div class="ptn"><input class="field" data-path="bouts.${i}.options.${j}.n" value="${esc(o.n||"")}" placeholder="Wrestler or team" aria-label="Entrant ${j+1}">
          <label class="check" style="margin:0"><input type="checkbox" data-path="bouts.${i}.options.${j}.c" data-kind="bool" ${o.c?"checked":""} aria-label="Champion">🏆</label>
          <button class="iconbtn" data-act="del" data-list="bouts.${i}.options" data-i="${j}" ${b.options.length<=2?"disabled":""} aria-label="Remove entrant">✕</button></div>`;
      });
      h += `<button class="iconbtn" data-act="add" data-list="bouts.${i}.options">Add entrant</button></div>`;
    });
    h += `<p><button class="btn" data-act="add" data-list="bouts">Add a match</button></p>`;

    h += `<h2>Bonus questions</h2>`;
    D.bonus.forEach((q,i)=>{
      h += `<div class="panel"><div class="mhead"><span class="ttl">Question ${i+1}</span>
        <button class="iconbtn" data-act="up" data-list="bonus" data-i="${i}" ${i===0?"disabled":""} aria-label="Move up">↑</button>
        <button class="iconbtn" data-act="down" data-list="bonus" data-i="${i}" ${i===D.bonus.length-1?"disabled":""} aria-label="Move down">↓</button>
        <button class="iconbtn" data-act="del" data-list="bonus" data-i="${i}">Remove</button></div>
        ${txt(`bonus.${i}.title`,"Question","Does anyone cash in tonight?")}
        ${txt(`bonus.${i}.stip`,"Note (optional)","")}
        <div class="fld"><label class="lab" for="qt_${i}">Answer type</label>
          <select class="field" id="qt_${i}" data-qtype="${i}">
            <option value="choice" ${q.type==="choice"?"selected":""}>Pick one of a few answers</option>
            <option value="number" ${q.type==="number"?"selected":""}>A number — closest guess wins</option>
            <option value="text" ${q.type==="text"?"selected":""}>Type a name</option></select></div>`;
      if(q.type==="choice"){
        h += `<div class="fld"><label class="lab" for="qo_${i}">Answers, separated by commas</label>
          <input class="field" id="qo_${i}" data-path="bonus.${i}.options" data-kind="csv" value="${esc((q.options||[]).join(", "))}" placeholder="Yes, No"></div>
          <div class="fld">${`<label class="check"><input type="checkbox" data-follow="${i}" ${q.followUp?"checked":""}>Also ask for a name</label>`}</div>`;
        if(q.followUp){
          h += txt(`bonus.${i}.followUp.label`,"Name question","Who?");
          h += `<div class="fld"><span class="lab">Ask for the name when the answer is</span>` + (q.options||[]).map(o=>
            `<label class="check"><input type="checkbox" data-when="${i}" value="${esc(o)}" ${(q.followUp.when||[]).indexOf(o)!==-1?"checked":""}>${esc(o)}</label>`).join("") + `</div>`;
        }
      }
      if(q.type==="number"){
        h += `<div class="grid2">${txt(`bonus.${i}.min`,"Lowest","", "num")}${txt(`bonus.${i}.max`,"Highest","", "num")}</div>
          <div class="grid2">${txt(`bonus.${i}.start`,"Starting number","", "num")}${txt(`bonus.${i}.unit`,"Unit (optional)","minutes")}</div>`;
      }
      if(q.type==="text") h += txt(`bonus.${i}.placeholder`,"Hint in the answer box (optional)","Name your pick");
      h += `</div>`;
    });
    h += `<p><button class="btn" data-act="add" data-list="bonus">Add a bonus question</button></p>`;

    if(!isNew){
      h += `<h2>Remove</h2><div class="panel">`;
      if(inFb && inRepo) h += `<p class="note" style="margin-top:0">This show was edited here. You can go back to the card it started with.</p><button class="btn" id="restoreBtn">Go back to the original card</button> `;
      h += `<button class="btn" id="deleteBtn">Delete this show</button><p class="note" style="margin-bottom:0">Deleting hides the show and its picks from the site.</p></div>`;
    }
    ed.innerHTML = h;
  }

  function newBout(){ return { id:"", title:"", stip:"", options:[{n:""},{n:""}] }; }
  function newBonus(){ return { id:"", type:"choice", title:"", options:["Yes","No"] }; }

  ed.addEventListener("input", e=>{
    const t = e.target; if(!t.dataset) return;
    dirty = true; $("#saveMsg").textContent = "Unsaved changes";
    if(t.dataset.kind==="start"){ D.start = fromLocalInput(t.value); return; }
    if(!t.dataset.path || t.dataset.kind==="bool" || t.dataset.kind==="csv") return;
    const v = t.dataset.kind==="num" ? (t.value==="" ? null : Number(t.value)) : t.value;
    setPath(D, t.dataset.path, v);
    if(t.dataset.path==="name") $("#edTitle").textContent = t.value || (isNew ? "New show" : "Untitled show");
  });
  ed.addEventListener("change", e=>{
    const t = e.target; dirty = true; $("#saveMsg").textContent = "Unsaved changes";
    if(t.dataset.qtype!==undefined){
      const q = D.bonus[+t.dataset.qtype]; q.type = t.value;
      if(q.type==="choice" && !(q.options||[]).length) q.options = ["Yes","No"];
      if(q.type!=="choice") delete q.followUp;
      if(q.type==="number"){ if(q.min==null) q.min = 0; if(q.max==null) q.max = 60; if(q.start==null) q.start = 20; }
      return paint();
    }
    if(t.dataset.follow!==undefined){
      const q = D.bonus[+t.dataset.follow];
      if(t.checked) q.followUp = { when:[(q.options||[])[0]].filter(Boolean), key:"", label:"Who?" }; else delete q.followUp;
      return paint();
    }
    if(t.dataset.when!==undefined){
      const q = D.bonus[+t.dataset.when], w = new Set(q.followUp.when||[]);
      t.checked ? w.add(t.value) : w.delete(t.value); q.followUp.when = Array.from(w); return;
    }
    if(t.dataset.kind==="bool"){
      if(/\.ladder$/.test(t.dataset.path)){ setPath(D, t.dataset.path, t.checked || undefined); setPath(D, t.dataset.path.replace(/\.ladder$/,".display"), t.checked ? "ladder" : undefined); return; }
      setPath(D, t.dataset.path, t.checked || undefined); return;
    }
    if(t.dataset.kind==="csv"){
      const q = getPath(D, t.dataset.path.replace(/\.options$/,""));
      q.options = t.value.split(",").map(x=>x.trim()).filter(Boolean);
      if(q.followUp) q.followUp.when = (q.followUp.when||[]).filter(w=>q.options.indexOf(w)!==-1);
      return paint();
    }
  });
  ed.addEventListener("click", e=>{
    const b = e.target.closest("[data-act]"); if(!b) return;
    const list = getPath(D, b.dataset.list), i = +b.dataset.i;
    dirty = true; $("#saveMsg").textContent = "Unsaved changes";
    if(b.dataset.act==="add") list.push(b.dataset.list==="bouts" ? newBout() : b.dataset.list==="bonus" ? newBonus() : { n:"" });
    if(b.dataset.act==="del"){
      const what = b.dataset.list==="bouts" ? "this match" : b.dataset.list==="bonus" ? "this question" : null;
      if(what && !confirm(`Remove ${what}? Any picks for it stop counting.`)) return;
      list.splice(i,1);
    }
    if(b.dataset.act==="up" && i>0) list.splice(i-1, 0, list.splice(i,1)[0]);
    if(b.dataset.act==="down" && i<list.length-1) list.splice(i+1, 0, list.splice(i,1)[0]);
    paint();
  });
  // ladder checkbox reads from display
  D.bouts.forEach(b=>{ b.ladder = b.display==="ladder" || undefined; });

  function validate(){
    const errs = [];
    if(!String(D.name||"").trim()) errs.push("Give the show a name.");
    if(!D.start) errs.push("Set the bell time.");
    if(!D.bouts.length) errs.push("Add at least one match.");
    D.bouts.forEach((b,i)=>{
      const names = b.options.map(o=>String(o.n||"").trim());
      if(!String(b.title||"").trim()) errs.push(`Match ${i+1} needs a title.`);
      if(names.filter(Boolean).length<2) errs.push(`Match ${i+1} needs at least two entrants.`);
      const seen = new Set(); names.filter(Boolean).forEach(n=>{ if(seen.has(norm(n))) errs.push(`Match ${i+1} lists ${n} twice.`); seen.add(norm(n)); });
    });
    D.bonus.forEach((q,i)=>{
      if(!String(q.title||"").trim()) errs.push(`Bonus question ${i+1} needs a question.`);
      if(q.type==="choice" && (q.options||[]).length<2) errs.push(`Bonus question ${i+1} needs at least two answers.`);
      if(q.type==="number" && !(Number(q.min) < Number(q.max))) errs.push(`Bonus question ${i+1}: the lowest number must be below the highest.`);
    });
    return errs;
  }

  async function save(){
    const errs = validate();
    if(errs.length){ $("#saveMsg").innerHTML = `<span class="err">${esc(errs[0])}${errs.length>1?` (and ${errs.length-1} more)`:""}</span>`; return; }
    const btn = $("#saveBtn"); btn.disabled = true; $("#saveMsg").textContent = "Saving…";
    try{
      await initDb();
      // ids: keep existing ones (picks are stored under them), make new ones from titles
      if(!D.id){
        const existing = (await allEvents().catch(()=>[])).map(e=>e.id);
        D.id = uniqueId(slug(D.name + " " + new Date(D.start).getFullYear()), existing);
      }
      const boutIds = D.bouts.map(b=>b.id).filter(Boolean);
      D.bouts.forEach(b=>{ if(!b.id){ b.id = uniqueId(slug(b.title).slice(0,24), boutIds); boutIds.push(b.id); } });
      const qIds = D.bonus.map(q=>q.id).filter(Boolean).concat(boutIds);
      D.bonus.forEach(q=>{
        if(!q.id){ q.id = uniqueId("q-" + slug(q.title).slice(0,20), qIds); qIds.push(q.id); }
        if(q.followUp && !q.followUp.key) q.followUp.key = (q.key || q.id) + "_who";
        if(q.type==="number"){ ["min","max","start"].forEach(k=>q[k] = Number(q[k])); if(!(q.start>=q.min && q.start<=q.max)) q.start = q.min; }
      });
      // renames → carry existing picks and results over to the new spelling
      const renames = [];
      D.bouts.forEach(b=>b.options.forEach(o=>{ o.n = String(o.n||"").trim(); if(o._k && o.n && o._k!==o.n) renames.push([b.id, o._k, o.n]); }));
      const out = JSON.parse(JSON.stringify(D, (k,v)=> (k==="_k" || k==="ladder") ? undefined : v));
      out.bouts.forEach(b=>{ b.options = b.options.filter(o=>o.n); b.options.forEach(o=>{ if(!o.c) delete o.c; }); });
      out.roster = Array.from(new Set(out.bouts.flatMap(b=>b.options.map(o=>o.n))));
      out.updatedAt = new Date().toISOString();
      const str = JSON.stringify(out);
      await withinMs(db.ref(CARD_PATH+"/"+out.id).set(str), 12000);
      let mirrored = true;
      try{ await withinMs(db.ref(PUBLIC_CARD_PATH+"/"+out.id).set(str), 8000); }catch(e){ mirrored = false; }
      if(renames.length){
        const snap = (await withinMs(db.ref(PRED_ROOT+"/"+out.id).once("value"), 10000)).val() || {};
        const upd = {};
        renames.forEach(([bid, from, to])=>{
          Object.keys(snap.picks||{}).forEach(k=>{ const p = (snap.picks[k]||{}).picks||{}; if(p[bid]===from) upd[`picks/${k}/picks/${bid}`] = to; });
          if((snap.results||{})[bid]===from) upd[`results/${bid}`] = to;
        });
        if(Object.keys(upd).length) await withinMs(db.ref(PRED_ROOT+"/"+out.id).update(upd), 10000);
      }
      CARD_CACHE[out.id] = out;
      D.bouts.forEach(b=>b.options.forEach(o=>{ o._k = o.n; }));
      dirty = false;
      $("#saveMsg").innerHTML = `Saved. <a href="#/${esc(out.id)}">Open the show</a>${mirrored ? "" : " · RyAI can't see this change until the database rules are updated."}`;
      if(isNew){ history.replaceState(null, "", "#/setup/"+out.id); }
    }catch(e){
      $("#saveMsg").innerHTML = `<span class="err">Didn't save: ${esc(e.message)}</span>`;
    }finally{ btn.disabled = false; }
  }
  $("#saveBtn").addEventListener("click", save);

  ed.addEventListener("click", async e=>{
    if(e.target.id==="deleteBtn"){
      const ok = await confirmDialog("Delete this show?", "It disappears from the site for everyone. Picks stay in the database, so restoring the card brings them back.", "Delete");
      if(!ok) return;
      try{
        if(inRepo) await withinMs(db.ref(CARD_PATH+"/"+D.id).set(JSON.stringify({ id:D.id, deleted:true })), 10000);
        else await withinMs(db.ref(CARD_PATH+"/"+D.id).remove(), 10000);
        try{ await withinMs(db.ref(PUBLIC_CARD_PATH+"/"+D.id).remove(), 8000); }catch(_){}
        delete CARD_CACHE[D.id]; location.hash = "#/setup";
      }catch(err){ toast("Couldn't delete: " + err.message); }
    }
    if(e.target.id==="restoreBtn"){
      const ok = await confirmDialog("Go back to the original card?", "Your edits to this show are thrown away.", "Go back");
      if(!ok) return;
      try{
        await withinMs(db.ref(CARD_PATH+"/"+D.id).remove(), 10000);
        try{ await withinMs(db.ref(PUBLIC_CARD_PATH+"/"+D.id).remove(), 8000); }catch(_){}
        delete CARD_CACHE[D.id]; route();
      }catch(err){ toast("Couldn't restore: " + err.message); }
    }
  });
  window.onbeforeunload = ()=> dirty ? "You have unsaved changes." : undefined;
  view = { teardown(){ window.onbeforeunload = null; } };
  paint();
}

// ════════════════════════════════════════════════════════════════════════════
// Party mode — #/<show id>/tv. A read-only big-screen view for show night.
// Before the bell: countdown, a QR code to join, and who's locked in. After it:
// everyone's picks for the match that's on, a full-screen reveal each time a
// result goes in on a phone, the live table, and the swap-token moment once the
// show is finalised. It never writes to the database.
// ════════════════════════════════════════════════════════════════════════════
const QR_LIB = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
let qrLoading = null;
function loadQR(){
  if(window.qrcode) return Promise.resolve();
  if(!qrLoading) qrLoading = new Promise((res, rej)=>{
    const s = document.createElement("script"); s.src = QR_LIB;
    s.onload = res; s.onerror = ()=>{ qrLoading = null; rej(new Error("QR code library didn't load")); };
    document.head.appendChild(s);
  });
  return qrLoading;
}
function qrSVG(text){
  try{ const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({ cellSize:4, margin:0, scalable:true }); }
  catch(e){ return ""; }
}
function clockFmt(ms){
  let s = Math.max(0, Math.ceil(ms/1000));
  const d = Math.floor(s/86400); s -= d*86400;
  const h = Math.floor(s/3600); s -= h*3600;
  const m = Math.floor(s/60); s -= m*60;
  if(d) return d+"d "+h+"h";
  return (h ? h+":"+pad2(m) : m) + ":" + pad2(s);
}
const clone = o => JSON.parse(JSON.stringify(o || {}));

async function showTV(id){
  document.body.classList.add("tv");
  $("#homeLink").classList.remove("hidden");
  const old = $("#tv"); if(old) old.remove();
  const host = document.createElement("div"); host.id = "tv";
  host.innerHTML = `<div class="tv-msg">Loading the card…</div>`;
  document.body.appendChild(host);

  const T = { dead:false, refs:[], timers:[], tick:null, picks:{}, results:{}, shown:{}, seen:{}, final:null, ryan:null,
              queue:[], showing:false, loaded:false, leaders:null, audio:null, wake:null, conn:null, qr:"",
              party:null, pShown:{}, pClaim:null };
  const onVis = ()=>{ if(document.visibilityState==="visible") keepAwake(); };
  let idleTimer = null;
  const onMove = ()=>{ host.classList.remove("idle"); clearTimeout(idleTimer); idleTimer = setTimeout(()=>host.classList.add("idle"), 3500); };
  view = {
    teardown(){
      T.dead = true; T.refs.forEach(r=>r.off()); clearInterval(T.tick); T.timers.forEach(clearTimeout); clearTimeout(idleTimer);
      document.removeEventListener("visibilitychange", onVis); document.removeEventListener("mousemove", onMove); document.removeEventListener("pointerdown", onMove);
      try{ if(T.wake) T.wake.release(); }catch(e){}
      host.remove(); document.body.classList.remove("tv");
    },
    repaint: ()=>{ if(T.loaded) paint(); }
  };
  document.addEventListener("visibilitychange", onVis);
  document.addEventListener("mousemove", onMove); document.addEventListener("pointerdown", onMove); onMove();
  const later = (fn, ms)=>{ const t = setTimeout(()=>{ if(!T.dead) fn(); }, ms); T.timers.push(t); return t; };

  let ev = CARD_CACHE[id] || await loadCard(id);
  if(T.dead) return;
  if(!ev){ host.innerHTML = `<div class="tv-msg">There's no show called “${esc(id)}”.</div>`; return; }
  if(!ev.id) ev.id = id;
  if(ev.legacySheet){ host.innerHTML = `<div class="tv-msg">This show is from the old sheet, so there's no party mode for it.</div>`; return; }
  const evStr = JSON.stringify(ev);
  const start = new Date(ev.start).getTime();
  const locked = ()=> Date.now() >= start;
  T.wasLocked = locked();
  document.body.dataset.theme = ev.theme || "ringside";
  document.title = ev.name + " — Party mode";
  const joinURL = location.origin + location.pathname + "#/" + ev.id;
  const base = PRED_ROOT + "/" + ev.id;
  const ROUNDS = partyRounds(ev);
  const partyOn = ()=>{ const P = T.party; return !!(P && P.on && !P.done && !locked()); };
  const pRound = ()=> T.party && typeof T.party.round==="number" ? T.party.round : -1;
  const joinShort = (location.host + location.pathname).replace(/\/(index\.html)?$/, "");

  // Everything that gets a result, in card order. Follow-up names count as their own item.
  const items = [];
  ev.bouts.forEach(b=>items.push({ key:b.id, kind:"bout", title:b.title, stip:b.stip, b }));
  (ev.bonus||[]).forEach(q=>{
    items.push({ key:bonusKey(q), kind:q.type || "choice", title:q.title, stip:q.stip, q });
    if(q.followUp) items.push({ key:q.followUp.key, kind:"follow", title:q.followUp.label, q, parent:bonusKey(q) });
  });
  const itemFor = k => items.find(i=>i.key===k);
  const relevant = (it, R)=> it.kind!=="follow" || (!blank(R[it.parent]) && (it.q.followUp.when||[]).indexOf(R[it.parent])!==-1);

  // Same cards the event page uses: Ryan = RyAI's picks with Ryan's own on top.
  function players(){
    const list = [];
    Object.keys(T.picks).forEach(k=>{
      if(k==="ryan") return;
      const e = T.picks[k]; if(!e || !e.picks || !Object.keys(e.picks).length) return;
      list.push({ key:k, name:nameFor(k,e), picks:e.picks });
    });
    const merged = Object.assign({}, (T.ryan && T.ryan.picks) || {});
    const own = (T.picks.ryan && T.picks.ryan.picks) || {};
    Object.keys(own).forEach(k=>{ if(!blank(own[k])) merged[k] = own[k]; });
    if(Object.keys(merged).length) list.push({ key:"ryan", name:"Ryan", picks:merged, bot:true });
    return list;
  }
  const hasPick = (it, v)=> !blank(v) && (it.kind==="bout" || it.kind==="follow" || it.kind==="text" || fits(it.q, v));
  function groupsFor(it, list){
    const g = [];
    if(it.kind==="bout") it.b.options.forEach(o=>g.push({ label:o.n, champ:!!o.c, who:[] }));
    else if(it.kind==="choice") (it.q.options||[]).forEach(o=>g.push({ label:o, who:[] }));
    list.forEach(p=>{
      const v = p.picks[it.key];
      if(!hasPick(it, v)) return;
      let grp = g.find(x=>norm(x.label)===norm(v));
      if(!grp){ grp = { label:String(v), who:[] }; g.push(grp); }
      grp.who.push(p);
    });
    if(it.kind==="number") g.sort((a,b)=>Number(a.label)-Number(b.label));
    return g;
  }
  const unit = (it, v) => it.kind==="number" && it.q.unit ? " " + (Number(v)===1 ? it.q.unit.replace(/s$/,"") : it.q.unit) : "";
  function pending(R){ return items.filter(it=>relevant(it, R) && blank(R[it.key])); }

  // ── standings from what's been revealed so far ──
  function table(){
    const list = players();
    const anyRes = items.some(it=>!blank(T.shown[it.key]));
    let rows = anyRes ? standings(ev, list, T.shown)
                      : list.map(p=>Object.assign({}, p, { correct:0, graded:0, bonus:0, answered:answeredCount(ev, p.picks) }));
    LEAGUE.forEach(l=>{ if(!rows.some(r=>r.key===l.key)) rows.push({ key:l.key, name:l.name, picks:{}, correct:0, graded:0, bonus:0, answered:0, empty:true }); });
    if(!anyRes){
      const at = k=>{ const i = LEAGUE_KEYS.indexOf(k); return i===-1 ? 99 : i; };
      rows.sort((a,b)=> at(a.key)-at(b.key) || a.name.localeCompare(b.name));
    }
    rows.forEach((r,i)=>{
      const first = rows.findIndex(x=>x.correct===r.correct && x.bonus===r.bonus);
      r.rank = first + 1;
      r.lead = anyRes && r.correct>0 && r.correct===rows[0].correct && r.bonus===rows[0].bonus;
    });
    return { rows, anyRes };
  }

  // ── shell ──
  host.innerHTML = `
    <div class="tv-grid">
      <header class="tv-head">
        <div style="min-width:0">
          <p class="promo">${esc(ev.promotion)}${ev.subtitle? " · "+esc(ev.subtitle):""}<span class="tv-conn" id="tvConn" title="Connection"></span></p>
          <h1 class="show-name">${esc(ev.name)}</h1>
        </div>
        <div class="tv-status" id="tvStatus"></div>
      </header>
      <section class="tv-main" id="tvMain"></section>
      <aside class="tv-board" id="tvBoardWrap"><h2>League table</h2><div id="tvBoard"></div><div id="tvLead"></div></aside>
      <footer class="tv-foot" id="tvFoot"></footer>
    </div>
    <div class="tv-reveal" id="tvReveal" aria-live="assertive"></div>
    <div class="tv-ctl"><span id="tvPartyCtl"></span><a href="#/${esc(ev.id)}">Exit</a><button id="tvFs">Full screen + sound</button></div>`;

  // ── header ──
  function paintStatus(){
    const el = $("#tvStatus", host); if(!el) return;
    const decided = items.filter(it=>relevant(it, T.shown) && !blank(T.shown[it.key])).length;
    const total = items.filter(it=>relevant(it, T.shown)).length;
    if(partyOn()){
      const r = pRound();
      el.innerHTML = `<p class="k">Party picks</p><p class="big">${r<0 ? "Lobby" : Math.min(r+1, ROUNDS.length)+"/"+ROUNDS.length}</p>
        <p class="sub">Bell in <span id="tvClock">${esc(clockFmt(start-Date.now()))}</span></p>`;
    } else if(T.final && T.final.winners && T.final.winners.length){
      el.innerHTML = `<p class="k">Final</p><p class="big">${decided}/${total}</p><p class="sub">results in</p>`;
    } else if(!locked()){
      el.innerHTML = `<p class="k">Picks lock in</p><p class="big" id="tvClock">${esc(clockFmt(start-Date.now()))}</p>
        <p class="sub">Bell at ${esc(fmtDate(ev.start,{hour:"numeric",minute:"2-digit"}))}</p>`;
    } else {
      el.innerHTML = `<p class="k"><span class="tv-live">Live</span></p><p class="big">${decided}/${total}</p><p class="sub">results in</p>`;
    }
  }

  // ── main panel ──
  function paintMain(){
    const el = $("#tvMain", host); if(!el) return;
    if(partyOn()) return paintParty(el);
    const list = players();
    if(T.final && T.final.winners && T.final.winners.length){
      const w = T.final.winners;
      el.innerHTML = `<div class="tv-done"><p class="tv-k">Final</p>
        <h2 class="tv-title">${esc(w.map(k=>nameFor(k)).join(" & "))} ${w.length>1?"share":"takes"} the swap token</h2>
        <div class="tv-champs">${w.map(k=>`<div class="c">${avatar(k, nameFor(k))}<span>${esc(nameFor(k))}${T.final.scores && T.final.scores[k] ? ` · ${esc(T.final.scores[k])}`:""}</span></div>`).join("")}</div>
        <p>${T.final.granted ? "It's already in AEW Fantasy — spend it on a roster swap." : "The token is on its way to AEW Fantasy."}</p></div>`;
      return;
    }
    if(!locked()){
      const done = list.filter(p=>answeredCount(ev, p.picks)>=totalQs(ev)).length;
      el.innerHTML = `<p class="tv-k">Make your picks</p>
        <h2 class="tv-title">${done ? `${done} card${done>1?"s":""} locked in` : "Grab your phone and call the card"}</h2>
        <div class="tv-pre" style="margin-top:1.4em">
          <div class="tv-join">${T.qr ? `<div class="qr" aria-label="QR code for the picks page">${T.qr}</div>` : ""}
            <p class="d">Scan or open</p><p class="url">${esc(joinShort)}</p>
            <p class="d">Tap your face, then call every match. Picks lock at the bell.</p></div>
          <div class="tv-card"><p class="tv-k" style="color:var(--dim)">Tonight's card · ${totalQs(ev)} calls</p><ol>
            ${ev.bouts.map(b=>`<li>${esc(b.title)}${b.stip?`<small>${esc(b.stip)}</small>`:""}</li>`).join("")}
            ${(ev.bonus||[]).length ? `<li>${(ev.bonus||[]).length} bonus question${ev.bonus.length>1?"s":""}<small>The tiebreaker if you're level on points</small></li>` : ""}
          </ol></div>
        </div>`;
      return;
    }
    const left = pending(T.shown);
    const it = left[0];
    if(!it){
      const { rows } = table();
      const leaders = rows.filter(r=>r.lead && LEAGUE_KEYS.indexOf(r.key)!==-1);
      el.innerHTML = `<div class="tv-done"><p class="tv-k">Every result's in</p>
        <h2 class="tv-title">${leaders.length ? esc(leaders.map(r=>r.name).join(" & ")) + (leaders.length>1?" are level at the top":" wins the night") : "That's the show"}</h2>
        <p>Open the show on a phone, go to League table and tap Finalise to send the swap token to AEW Fantasy.</p></div>`;
      return;
    }
    const groups = groupsFor(it, list);
    const most = Math.max(0, ...groups.map(g=>g.who.length));
    const answered = list.filter(p=>hasPick(it, p.picks[it.key])).length;
    const few = groups.length<=3 && it.kind!=="number";
    const label = it.kind==="bout" ? "Up now" : it.kind==="follow" ? "Name it" : "Bonus question";
    el.innerHTML = `<p class="tv-k">${label}</p><h2 class="tv-title">${esc(it.title)}</h2>${it.stip?`<p class="tv-stip">${esc(it.stip)}</p>`:""}
      <div class="tiles ${few?"few":""}">` + (groups.length ? groups.map(g=>`
        <div class="tile ${g.who.length && g.who.length===most && most<answered ? "fav" : ""} ${g.who.length?"":"none"}">
          <div class="tn">${esc(g.label)}${esc(unit(it, g.label))}${g.champ?`<span class="champ">Champion</span>`:""}</div>
          <div class="tw">${g.who.map(p=>avatar(p.key, p.name)).join("")}</div>
          <div class="tc">${g.who.length ? (g.who.length===answered && answered>1 ? "Everyone" : g.who.map(p=>esc(p.name)).join(", ")) : "Nobody"}</div>
        </div>`).join("") : `<div class="tile none"><div class="tn">Nobody answered this one</div></div>`) + `</div>
      ${left.length>1 ? `<div class="tv-next"><b>Up next</b>${left.slice(1,4).map(n=>`<span>${esc(n.title)}</span>`).join("")}${left.length>4?`<span>+${left.length-4} more</span>`:""}</div>` : ""}`;
  }

  // ── league table, animated when places change ──
  function paintBoard(){
    const el = $("#tvBoard", host); if(!el) return;
    const { rows, anyRes } = table();
    const tb = (ev.bonus||[]).length>0, tot = totalQs(ev), pre = !locked();
    const bonusIn = (ev.bonus||[]).some(q=>!blank(T.shown[bonusKey(q)]));
    const before = {};
    el.querySelectorAll("[data-k]").forEach(n=>{ before[n.dataset.k] = n.getBoundingClientRect().top; });
    el.innerHTML = rows.map(r=>{
      const tag = r.bot ? "🤖 RyAI" + (T.picks.ryan && T.picks.ryan.picks && Object.keys(T.picks.ryan.picks).length ? " + Ryan" : "") : (LEAGUE_KEYS.indexOf(r.key)===-1 ? "Guest" : "");
      let right;
      if(anyRes) right = `<span class="pts">${r.correct}<small>${bonusIn ? r.bonus+" bonus" : r.correct===1 ? "pt" : "pts"}</small></span>`;
      else if(pre || !r.answered){
        const full = r.answered>=tot;
        right = `<span class="bar ${full?"done":""}"><span class="track"><span class="fill" style="width:${tot?r.answered/tot*100:0}%"></span></span>
          <span class="l">${full ? "✓ Locked in" : r.answered ? r.answered+" of "+tot : "No picks yet"}</span></span>`;
      } else right = `<span class="pts">0<small>pts</small></span>`;
      return `<div class="tvr ${r.lead?"lead":""} ${r.empty?"empty":""}" data-k="${esc(r.key)}">
        <span class="rk">${anyRes ? r.rank : "·"}</span>${avatar(r.key, r.name)}
        <span class="nm">${esc(r.name)}${tag?`<small>${esc(tag)}</small>`:""}</span>${right}</div>`;
    }).join("") + (anyRes && tb ? `<p class="note2">Level on points? Most bonus questions right wins it.</p>` : "");
    if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
      el.querySelectorAll("[data-k]").forEach(n=>{
        const b = before[n.dataset.k]; if(b==null) return;
        const d = b - n.getBoundingClientRect().top;
        if(Math.abs(d)>1 && n.animate) n.animate([{ transform:`translateY(${d}px)` }, { transform:"none" }], { duration:800, easing:"cubic-bezier(.2,.8,.2,1)" });
      });
    }
    // Lead changes get a shout
    const leaders = rows.filter(r=>r.lead && LEAGUE_KEYS.indexOf(r.key)!==-1).map(r=>r.key).join(",");
    if(T.leaders!==null && leaders && leaders!==T.leaders && !T.final){
      const names = rows.filter(r=>leaders.split(",").indexOf(r.key)!==-1).map(r=>r.name);
      const box = $("#tvLead", host);
      box.innerHTML = `<div class="tv-lead">${names.length>1 ? esc(names.join(" & "))+" level at the top" : "New leader: "+esc(names[0])}</div>`;
      later(()=>{ box.innerHTML = ""; }, 7000);
    }
    T.leaders = leaders;
  }

  // ── footer: results so far ──
  function paintFoot(){
    const el = $("#tvFoot", host); if(!el) return;
    const list = players();
    const done = items.filter(it=>relevant(it, T.shown) && !blank(T.shown[it.key]));
    const ticks = done.slice(-5).reverse().map(it=>{
      const v = T.shown[it.key];
      const base = Object.assign({}, T.shown); delete base[it.key];
      const everyone = list.map(p=>p.picks);
      const hit = list.filter(p=>scoreCard(ev, p.picks, T.shown, everyone).correct > scoreCard(ev, p.picks, base, everyone).correct);
      const short = it.title.replace(/^(AEW |Tailgate Brawl: )/,"").replace(/ Championship$/," title");
      return `<span class="tk"><span>${esc(short)}</span> <b>${esc(v)}${esc(unit(it, v))}</b>${hit.length ? hit.map(p=>avatar(p.key,p.name)).join("") : `<span class="zero">nobody</span>`}</span>`;
    }).join("");
    el.innerHTML = `<div class="tv-ticker">${ticks || (locked() ? `<span>Results show up here as they go in on a phone.</span>` : `<span>Enter results on a phone during the show and they'll pop up here.</span>`)}</div>
      ${locked() ? `<span class="join">Join: <b>${esc(joinShort)}</b></span>` : ""}`;
  }

  function paint(){
    if(T.dead) return;
    paintStatus(); paintMain(); paintBoard(); paintFoot(); paintCtl();
  }

  // ── party picks: lobby, then one round at a time ──
  const pName = k => nameFor(k, T.party && T.party.players && T.party.players[k]);
  function paintCtl(){
    const el = $("#tvPartyCtl", host); if(!el) return;
    let h = "";
    if(!locked() && db){
      if(partyOn()) h = `<button class="ghost" id="pEnd">End party picks</button>`;
      else h = `<button id="pBegin">🎉 Party picks</button>`;
    }
    el.innerHTML = h;
    const b = $("#pBegin", el);
    if(b) b.addEventListener("click", ()=>{
      const restart = T.party && T.party.done;
      if(restart && !confirm("Run party picks again from the first match? Everyone's picks so far are kept.")) return;
      T.pShown = {};
      db.ref(base+"/party").set({ on:true, round:-1, at:Date.now() }).catch(e=>toast(e.message));
    });
    const e = $("#pEnd", el);
    if(e) e.addEventListener("click", ()=>{ if(confirm("End party picks? Phones go back to the full card.")) db.ref(base+"/party/done").set(true).catch(err=>toast(err.message)); });
  }
  function paintParty(el){
    const P = T.party, r = pRound(), joined = Object.keys(P.players || {});
    const lk = (P.locks && P.locks[r]) || {};
    const face = (k, inn, label)=>`<div class="pp ${inn?"in":""}">${avatar(k, pName(k))}<b>${esc(pName(k))}</b><small>${label}</small></div>`;
    if(r<0){
      el.innerHTML = `<p class="tv-k">Party picks</p><h2 class="tv-title">${joined.length ? joined.length + (joined.length>1?" players in":" player in") : "Grab your phone and join in"}</h2>
        <div class="tv-pre" style="margin-top:1.4em">
          <div class="tv-join">${T.qr ? `<div class="qr" aria-label="QR code for the picks page">${T.qr}</div>` : ""}
            <p class="d">Scan or open</p><p class="url">${esc(joinShort)}</p><p class="d">Tap your face, then “I'm playing”.</p></div>
          <div><div class="pp-row">${joined.map(k=>face(k, true, "Ready")).join("") || `<p class="tv-stip">Nobody's in yet.</p>`}</div>
            <p class="tv-stip" style="margin-top:1.6em;max-width:30em">One match at a time: everyone locks in on their phone, the TV shows who picked whom, then on to the next. Bonus questions come last, all together.</p>
            <p style="margin-top:1.6em"><button class="tv-btn" id="pStart" ${joined.length?"":"disabled"}>Start the first match</button></p></div>
        </div>`;
    } else {
      const R = ROUNDS[r]; if(!R){ el.innerHTML = ""; return; }
      const done = joined.filter(k=>lk[k]).length;
      const body = R.kind==="bout"
        ? `<div class="tiles bare ${R.b.options.length<=3?"few":""}">${R.b.options.map(o=>`<div class="tile"><div class="tn">${esc(o.n)}${o.c?`<span class="champ">Champion</span>`:""}</div></div>`).join("")}</div>`
        : `<ol class="pq">${(ev.bonus||[]).map(q=>`<li>${esc(q.title)}</li>`).join("")}</ol>`;
      el.innerHTML = `<p class="tv-k">${R.kind==="bout" ? `Match ${r+1} of ${ev.bouts.length} · make your pick` : "Bonus round · answer them all"}</p>
        <h2 class="tv-title">${esc(R.title)}</h2>${R.stip?`<p class="tv-stip">${esc(R.stip)}</p>`:""}${body}
        <div class="pp-foot"><div class="pp-row">${joined.map(k=>face(k, !!lk[k], lk[k] ? "✓ Locked in" : "Picking…")).join("")}</div>
          ${done && done<joined.length && !(P.revealed && P.revealed[r]) ? `<button class="tv-btn ghost" id="pNow">Reveal now</button>` : ""}</div>`;
    }
    const st = $("#pStart", el);
    if(st) st.addEventListener("click", ()=>{ st.disabled = true; db.ref(base+"/party/round").transaction(c=> c===-1 ? 0 : undefined).catch(e=>toast(e.message)); });
    const nw = $("#pNow", el);
    if(nw) nw.addEventListener("click", ()=>claimReveal(r));
  }
  // Everyone in? Mark the round revealed (any TV can; the first wins). Every TV then shows it.
  function partyCheck(){
    if(!partyOn() || !db) return;
    const P = T.party, r = pRound(); if(r<0 || r>=ROUNDS.length) return;
    const joined = Object.keys(P.players || {}), lk = (P.locks && P.locks[r]) || {};
    if(P.revealed && P.revealed[r]){
      // Reveal shown but never moved on (a TV reloaded mid-reveal): nudge it along.
      if(!T.showing && !T.queue.length && Date.now() - Number(P.revealed[r]) > 25000) advance(r);
      return;
    }
    if(joined.length && joined.every(k=>lk[k]) && T.pClaim!==r){ T.pClaim = r; later(()=>claimReveal(r), 1200); }
  }
  function claimReveal(r){
    db.ref(base+"/party/revealed/"+r).transaction(c=> c ? undefined : Date.now()).catch(()=>{ T.pClaim = null; });
  }
  function advance(r){
    db.ref(base+"/party").transaction(p=>{
      if(!p || p.round!==r || p.done) return;
      p.round = r+1; if(p.round>=ROUNDS.length) p.done = true;
      return p;
    }).catch(()=>{});
  }
  function partyRevealHTML(r){
    const R = ROUNDS[r], list = players();
    const tiles = it=>{
      const g = groupsFor(it, list).filter(x=>x.who.length || it.kind==="bout");
      return g.map(x=>`<div class="tile ${x.who.length?"":"none"}"><div class="tn">${esc(x.label)}${esc(unit(it, x.label))}${x.champ?`<span class="champ">Champion</span>`:""}</div>
        <div class="tw">${x.who.map(p=>avatar(p.key, p.name)).join("")}</div><div class="tc">${x.who.length ? x.who.map(p=>esc(p.name)).join(", ") : "Nobody"}</div></div>`).join("");
    };
    if(R.kind==="bout"){
      const it = itemFor(R.id), g = groupsFor(it, list).filter(x=>x.who.length);
      const total = g.reduce((a,x)=>a+x.who.length, 0);
      let flair = "";
      if(g.length===1 && total>1) flair = `Unanimous — everyone's on ${esc(g[0].label)}`;
      else if(total>=3){
        const lone = g.find(x=>x.who.length===1);
        if(g.length>=2 && g[0].who.length===g[1].who.length && g.length===2) flair = "Split right down the middle";
        else if(lone) flair = `${esc(lone.who[0].name)} is out on an island with ${esc(lone.label)}`;
      }
      return `<div class="rv"><p class="rv-k">Match ${r+1} picks</p><h2 class="rv-t">${esc(R.title)}</h2>
        <div class="rv-tiles ${it.b.options.length<=3?"few":""}">${tiles(it)}</div>${flair?`<p class="rv-x">${flair}</p>`:""}</div>`;
    }
    return `<div class="rv"><p class="rv-k">Bonus round picks</p>
      <div class="rv-bq">${(ev.bonus||[]).map(q=>{ const it = itemFor(bonusKey(q));
        const g = groupsFor(it, list).filter(x=>x.who.length);
        return `<div class="bq"><h3>${esc(q.title)}</h3><div class="bqa">${g.map(x=>`<span class="ans"><b>${esc(x.label)}${esc(unit(it, x.label))}</b>${x.who.map(p=>avatar(p.key, p.name)).join("")}</span>`).join("") || `<span class="tc">No answers</span>`}</div></div>`; }).join("")}</div></div>`;
  }

  // ── reveals ──
  const rvEl = ()=>$("#tvReveal", host);
  function enqueue(){
    items.forEach(it=>{
      const nv = T.results[it.key], ov = T.seen[it.key];
      if(blank(nv) || norm(nv)===norm(ov)) return;
      if(!T.queue.some(q=>q.key===it.key)) T.queue.push({ key:it.key, correction:!blank(ov) });
    });
    T.seen = clone(T.results);
  }
  function pump(){
    if(T.showing || T.dead) return;
    const next = T.queue.shift();
    if(!next){ T.shown = clone(T.results); paint(); return; }
    if(next.special) return special(next);
    const it = itemFor(next.key), v = T.results[next.key];
    if(!it || blank(v)) return pump();
    const after = clone(T.shown); after[next.key] = v;
    const base = clone(after); delete base[next.key];
    const list = players(), everyone = list.map(p=>p.picks);
    const hits = [], misses = [];
    list.forEach(p=>{
      const got = scoreCard(ev, p.picks, after, everyone).correct > scoreCard(ev, p.picks, base, everyone).correct;
      if(got) hits.push(p); else if(hasPick(it, p.picks[it.key])) misses.push(p);
    });
    const lbl = it.kind==="bout" ? "Winner" : it.kind==="number" ? "Actual" : "Answer";
    const person = (p, extra)=>`<span class="rv-p">${avatar(p.key, p.name)}<b>${esc(p.name)}</b>${extra}</span>`;
    let flair = "";
    if(!hits.length && misses.length>1) flair = "Nobody saw that coming";
    else if(hits.length>1 && !misses.length) flair = "Clean sweep — everyone called it";
    else if(hits.length===1 && misses.length>1) flair = esc(hits[0].name) + " is the only one who called it";
    show(`<div class="rv">
      <p class="rv-k">${next.correction ? "Correction" : it.kind==="bout" ? "Result" : "Bonus question"}</p>
      <h2 class="rv-t">${esc(it.title)}</h2>
      <span class="rv-l">${lbl}</span><span class="rv-v">${esc(v)}${esc(unit(it, v))}</span>
      <div class="rv-groups">
        <div class="rv-g hit"><h3>${it.kind==="number" ? "Closest" : "Called it"}</h3>${hits.length ? hits.map(p=>person(p, `<span class="plus">+1</span>${it.kind==="number" ? `<small>guessed ${esc(p.picks[it.key])}</small>` : ""}`)).join("") : `<p class="nobody">Nobody</p>`}</div>
        <div class="rv-g miss"><h3>Missed</h3>${misses.length ? misses.map(p=>person(p, `<small>${it.kind==="number"?"guessed ":""}${esc(p.picks[it.key])}</small>`)).join("") : `<p class="nobody">Nobody</p>`}</div>
      </div>${flair ? `<p class="rv-x">${flair}</p>` : ""}</div>`,
      T.queue.length ? 8000 : 10000, 1, ()=>{ T.shown = after; });
  }
  function special(next){
    const kind = next.special;
    if(kind==="party"){
      const r = next.round, R = ROUNDS[r];
      if(!R) return pump();
      show(partyRevealHTML(r), R.kind==="bonus" ? 15000 : 9000, 1, ()=>advance(r));
      return;
    }
    if(kind==="partydone"){
      show(`<div class="rv"><p class="rv-k">That's every pick</p><h2 class="rv-big">Cards are in</h2>
        <p class="rv-sub">Change anything on your phone until the bell at ${esc(fmtDate(ev.start,{hour:"numeric",minute:"2-digit"}))}.</p></div>`, 7000, 3);
      return;
    }
    if(kind==="bell"){
      const list = players();
      show(`<div class="rv"><p class="rv-k">Ding ding ding</p><h2 class="rv-big">Picks are locked</h2>
        <p class="rv-sub">${list.length} card${list.length===1?"":"s"} in. Good luck, everyone.</p></div>`, 6000, 3);
      return;
    }
    if(kind==="final"){
      const f = T.final;
      if(!f || !f.winners || !f.winners.length) return pump();
      const w = f.winners;
      show(`<div class="rv"><p class="rv-k">And the winner is</p>
        <h2 class="rv-big">${esc(w.map(k=>nameFor(k)).join(" & "))}</h2>
        <div class="tv-champs">${w.map(k=>`<div class="c">${avatar(k, nameFor(k))}</div>`).join("")}</div>
        <p class="rv-sub">${w.length>1 ? "Level at the top — a swap token each" : "Takes the swap token"}${f.scores && f.scores[w[0]] ? " · " + esc(f.scores[w[0]]) : ""}</p></div>`, 20000, 3);
    }
  }
  // Show one overlay, then take it down, apply its result and move on.
  function show(html, ms, dings, apply){
    T.showing = true;
    const el = rvEl(); el.innerHTML = html;
    void el.offsetWidth; el.classList.add("on");
    ding(dings);
    let finished = false;
    const finish = ()=>{
      if(finished) return; finished = true;
      el.classList.remove("on"); el.onclick = null;
      later(()=>{
        if(apply) apply();
        paint();
        later(()=>{ T.showing = false; pump(); }, 1600);
      }, 450);
    };
    el.onclick = finish;
    later(finish, ms);
  }

  // ── sound + screen ──
  function ding(n){
    const ctx = T.audio; if(!ctx || !n) return;
    for(let i=0;i<n;i++){
      const t0 = ctx.currentTime + 0.05 + i*0.38;
      [[1, .5], [2.76, .22], [5.4, .1]].forEach(([m, g])=>{
        const o = ctx.createOscillator(), a = ctx.createGain();
        o.type = "sine"; o.frequency.value = 880*m;
        a.gain.setValueAtTime(0, t0); a.gain.linearRampToValueAtTime(g*.45, t0+.006); a.gain.exponentialRampToValueAtTime(.0001, t0+1.5);
        o.connect(a); a.connect(ctx.destination); o.start(t0); o.stop(t0+1.6);
      });
    }
  }
  async function keepAwake(){
    try{ if(navigator.wakeLock && document.visibilityState==="visible" && !T.dead && !T.wake){ T.wake = await navigator.wakeLock.request("screen"); T.wake.addEventListener("release", ()=>{ T.wake = null; }); } }catch(e){}
  }
  const fsBtn = $("#tvFs", host);
  fsBtn.addEventListener("click", async ()=>{
    try{
      if(!T.audio){ const A = window.AudioContext || window.webkitAudioContext; if(A) T.audio = new A(); }
      if(T.audio && T.audio.state==="suspended") await T.audio.resume();
    }catch(e){}
    ding(1); keepAwake();
    try{ if(!document.fullscreenElement && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); }catch(e){}
    fsBtn.textContent = "Sound on";
  });
  keepAwake();

  // ── clock ──
  T.tick = setInterval(()=>{
    const c = $("#tvClock", host);
    if(c && !locked()) c.textContent = clockFmt(start - Date.now());
    if(T.loaded && partyOn()) partyCheck();
    if(!T.wasLocked && locked()){ T.wasLocked = true; paint(); T.queue.unshift({ special:"bell" }); pump(); }
  }, 1000);

  // ── data ──
  loadQR().then(()=>{ T.qr = qrSVG(joinURL); if(T.loaded && !locked()) paintMain(); }).catch(()=>{});
  getJSON("picks/"+ev.id+"/ryan.json").then(r=>{ T.ryan = r; if(T.loaded) paint(); }).catch(()=>{});
  try{
    await initDb();
    if(T.dead) return;
    const conn = db.ref(".info/connected");
    conn.on("value", s=>{ const c = $("#tvConn", host); if(c) c.className = "tv-conn " + (s.val()===true ? "ok" : "err"); });
    T.refs.push(conn);
    const cardRef = db.ref(CARD_PATH+"/"+ev.id);
    cardRef.on("value", snap=>{
      const d = parseDef(snap.val());
      if(!d || d.deleted) return;
      if(!d.id) d.id = ev.id;
      if(JSON.stringify(d)===evStr) return;
      CARD_CACHE[ev.id] = d;
      if(view && view.teardown) view.teardown();
      view = null;
      showTV(ev.id);
    });
    T.refs.push(cardRef);
    const ref = db.ref(PRED_ROOT + "/" + ev.id);
    ref.on("value", snap=>{
      const v = snap.val() || {};
      T.picks = v.picks || {};
      T.results = v.results || {};
      const fin = v.final || null;
      if(fin) fin.winners = arrayOf(fin.winners);
      const P = v.party || null, wasDone = !!(T.party && T.party.done), wasOn = !!(T.party && T.party.on);
      T.party = P;
      if(!T.loaded){
        T.loaded = true; T.seen = clone(T.results); T.shown = clone(T.results); T.final = fin;
        if(P && P.revealed) Object.keys(P.revealed).forEach(r=>{ T.pShown[r] = true; });
        // Opening party mode before the bell starts party picks (unless they've already been played).
        if(!locked() && !(P && (P.on || P.done))) db.ref(base+"/party").transaction(c=> c && (c.on || c.done) ? undefined : { on:true, round:-1, at:Date.now() }).catch(()=>{});
        paint(); partyCheck(); return;
      }
      if(P && P.on && !locked()){
        if(P.revealed) Object.keys(P.revealed).forEach(r=>{
          if(T.pShown[r]) return; T.pShown[r] = true;
          if(Number(r)===P.round) T.queue.push({ special:"party", round:Number(r) });
        });
        if(P.done && !wasDone && wasOn) T.queue.push({ special:"partydone" });
      }
      if(!P || !P.on) T.pShown = {};
      const newFinal = !!(fin && fin.winners && fin.winners.length && !(T.final && T.final.winners && T.final.winners.length));
      T.final = fin;
      enqueue();
      if(newFinal) T.queue.push({ special:"final" });
      if(!T.showing && !T.queue.length) T.shown = clone(T.results);
      paint();
      pump();
      partyCheck();
    }, err=>{ host.querySelector("#tvFoot").innerHTML = `<span>Can't read the picks: ${esc(err.message)}</span>`; });
    T.refs.push(ref);
  }catch(e){
    host.innerHTML = `<div class="tv-msg">Can't reach the database (${esc(e.message)}). Check the connection and reload.</div>`;
  }
}

// ── tiny confirm dialog ──
function confirmDialog(title, body, okLabel){
  return new Promise(res=>{
    const host = $("#dialogs");
    host.innerHTML = `<div class="scrim" role="dialog" aria-modal="true" aria-labelledby="dlgT"><div class="dialog">
      <h3 id="dlgT">${esc(title)}</h3><p>${body}</p>
      <div class="btns"><button class="btn" data-a="no">Cancel</button><button class="btn primary" data-a="yes">${esc(okLabel)}</button></div></div></div>`;
    const done = v=>{ host.innerHTML = ""; res(v); };
    host.querySelector('[data-a="yes"]').focus();
    host.querySelector(".scrim").addEventListener("click", e=>{
      if(e.target.dataset.a==="yes") done(true);
      else if(e.target.dataset.a==="no" || e.target.classList.contains("scrim")) done(false);
    });
  });
}

route();
</script>
