<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Prediction Sheet</title>
<meta name="theme-color" content="#16181d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Cinzel:wght@700;900&family=Lilita+One&family=Orbitron:wght@700;800;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ── Themes ─────────────────────────────────────────────────────────────
     Each show names a theme in its event file. The home page uses "ringside". */
  :root, body[data-theme="ringside"]{
    --bg:#16181d; --surface:#1e2128; --surface2:#262a33; --line:#343946;
    --text:#ecebe6; --dim:#9a9ca6; --accent:#e9c46a; --accent-ink:#1a1608;
    --good:#5fbf8f; --bad:#e0644f; --display:'Big Shoulders Display',sans-serif;
    --display-weight:900; --display-track:0.01em; --display-case:none;
  }
  body[data-theme="briefcase"]{
    --bg:#0c2a22; --surface:#12362c; --surface2:#184236; --line:#2a5a4b;
    --text:#efe7d2; --dim:#a8bfb3; --accent:#d9a93a; --accent-ink:#1d1504;
    --good:#7fd6a6; --bad:#e4705a;
  }
  /* New Orleans: Mardi Gras purple, green and gold under a gaslit night */
  body[data-theme="nola"]{
    --bg:#1b0f2e; --surface:#26163d; --surface2:#31204c; --line:#4a3468;
    --text:#f6eedb; --dim:#bfaed6; --accent:#f2c14e; --accent-ink:#241602;
    --good:#4cc38a; --bad:#f07a63; --nola-green:#46d36b; --nola-purple:#7b55d6; --iron:#0d0618;
    --display:'Orbitron','Big Shoulders Display',sans-serif; --display-weight:900; --display-track:0.01em;
  }
  /* WrestleDream: watercolour dawn, crimson silk ribbon, gold-framed plaques */
  body[data-theme="dream"]{
    --bg:#13172a; --surface:#1c2136; --surface2:#252b44; --line:#3a4262;
    --text:#f7f1e3; --dim:#b3b4c8; --accent:#e9b65a; --accent-ink:#2a1a04;
    --good:#5cc79a; --bad:#ef6b5b; --dream-red:#d3243a; --dream-gold:#e9b65a; --dream-sky:#7fa8c9;
    --display:'Lilita One','Big Shoulders Display',sans-serif; --display-weight:400; --display-track:0.01em;
  }
  body[data-theme="matchday"]{
    --bg:#070d1f; --surface:#0e1936; --surface2:#152242; --line:#243358;
    --text:#f3f1ea; --dim:#8f9cbd; --accent:#c8102e; --accent-ink:#fff;
    --good:#3f9e6b; --bad:#c8102e; --display:'Playfair Display',serif;
    --display-weight:900; --display-track:0;
  }

  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:400 16px/1.5 'Public Sans',system-ui,sans-serif;
    min-height:100vh; padding-bottom:calc(48px + env(safe-area-inset-bottom));
  }
  button, input, select{ font:inherit; color:inherit; }
  button{ cursor:pointer; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  a{ color:var(--accent); }
  .wrap{ max-width:720px; margin:0 auto; padding:0 16px; }
  .hidden{ display:none !important; }

  /* ── Top bar ── */
  .topbar{ display:flex; align-items:center; gap:12px; padding:14px 0 0; font-size:14px; color:var(--dim); }
  .topbar a{ color:var(--dim); text-decoration:none; }
  .topbar a:hover{ color:var(--text); }
  .topbar .grow{ flex:1; }
  .live{ display:inline-flex; align-items:center; gap:6px; font-size:13px; }
  .live::before{ content:""; width:8px; height:8px; border-radius:50%; background:var(--dim); }
  .live.ok::before{ background:var(--good); }
  .live.err::before{ background:var(--bad); }

  /* ── Hero ── */
  .hero{ padding:28px 0 20px; }
  .promo{ font-size:14px; color:var(--dim); margin:0 0 6px; }
  .show-name{
    font-family:var(--display); font-weight:var(--display-weight); letter-spacing:var(--display-track);
    font-size:clamp(56px, 17vw, 132px); line-height:0.86; margin:0; text-wrap:balance;
  }
  body[data-theme="briefcase"] .show-name{ color:var(--accent); }
  body[data-theme="nola"]{ background:
      radial-gradient(120% 60% at 85% -10%, rgba(242,193,78,.16), transparent 60%),
      radial-gradient(90% 50% at -10% 0%, rgba(139,92,196,.28), transparent 60%), no-repeat var(--bg); }
  /* Show-poster type: heavy, wide, leaning forward; violet letters with a green edge */
  body[data-theme="nola"] .show-name{
    font-size:clamp(46px, 18vw, 124px); line-height:.98; text-transform:uppercase; letter-spacing:.005em;
    color:var(--nola-purple); -webkit-text-stroke:clamp(1.5px, .55vw, 3.5px) var(--nola-green); paint-order:stroke fill;
    transform:skewX(-7deg); transform-origin:left bottom;
    text-shadow:0 5px 0 #0f0820, 0 0 34px rgba(70,211,107,.22);
  }
  body[data-theme="nola"] .show-name .joiner{
    display:block; font-size:.3em; font-weight:800; letter-spacing:.12em; color:var(--nola-green);
    -webkit-text-stroke:0; text-shadow:none; margin:.15em 0 .1em .2em;
  }
  body[data-theme="nola"] .show-sub{
    font-family:var(--display); font-weight:900; font-style:normal; text-transform:uppercase; letter-spacing:.04em;
    font-size:clamp(20px, 6vw, 34px); color:var(--nola-green); transform:skewX(-7deg); transform-origin:left bottom; margin-top:10px;
  }
  body[data-theme="nola"] .bout h3{ font-weight:800; font-size:19px; line-height:1.25; letter-spacing:.01em; }
  body[data-theme="nola"] .section-head{ font-weight:900; font-size:24px; text-transform:uppercase; color:var(--nola-green); transform:skewX(-7deg); transform-origin:left; }
  body[data-theme="nola"] .lockline .count{ font-weight:900; font-size:26px; color:var(--accent); }
  body[data-theme="nola"] .winner h3{ font-size:24px; }
  body[data-theme="nola"] .bout{ border-left-color:var(--nola-purple); }
  body[data-theme="nola"] .bout:nth-of-type(3n+2){ border-left-color:var(--nola-green); }
  body[data-theme="nola"] .bout:nth-of-type(3n){ border-left-color:var(--accent); }
  body[data-theme="nola"] .bout.correct{ border-left-color:var(--good); }
  body[data-theme="nola"] .bout.wrong{ border-left-color:var(--bad); }
  body[data-theme="dream"]{ background:
      radial-gradient(110% 55% at 80% -12%, rgba(233,182,90,.22), transparent 62%),
      radial-gradient(80% 45% at 0% -5%, rgba(127,168,201,.25), transparent 62%),
      radial-gradient(70% 40% at 100% 30%, rgba(211,36,58,.10), transparent 60%), no-repeat var(--bg); }
  /* Poster wordmark: chunky white letters, crimson outline, inked drop shadow */
  body[data-theme="dream"] .show-name{
    font-size:clamp(40px, 12.6vw, 104px); line-height:.95; text-transform:uppercase; letter-spacing:.005em;
    color:#fffaf0; -webkit-text-stroke:clamp(2px, .7vw, 5px) var(--dream-red); paint-order:stroke fill;
    text-shadow:0 5px 0 #4a0d17, 0 0 40px rgba(233,182,90,.28);
  }
  body[data-theme="dream"] .promo{ font-family:'Cinzel',serif; font-weight:900; letter-spacing:.3em; color:var(--dream-gold); }
  body[data-theme="dream"] .show-sub{
    display:inline-block; font-family:'Cinzel',serif; font-weight:900; font-style:normal; text-transform:uppercase; letter-spacing:.14em;
    font-size:clamp(16px, 4.6vw, 24px); color:var(--dream-gold); margin-top:12px; padding:5px 14px;
    border:2px solid var(--dream-gold); border-radius:3px; box-shadow:inset 0 0 0 3px var(--bg), inset 0 0 0 4px rgba(233,182,90,.5);
  }
  body[data-theme="dream"] .bout h3, body[data-theme="dream"] .section-head{ font-family:'Cinzel',serif; font-weight:900; letter-spacing:.02em; }
  body[data-theme="dream"] .bout h3{ font-size:18px; line-height:1.3; color:var(--dream-gold); }
  body[data-theme="dream"] .section-head{ font-size:22px; text-transform:uppercase; color:#fffaf0; letter-spacing:.08em; }
  body[data-theme="dream"] .lockline .count{ font-family:'Lilita One',sans-serif; font-weight:400; font-size:28px; color:#fffaf0; }
  body[data-theme="dream"] .winner h3{ font-size:22px; }
  body[data-theme="dream"] .bout{ border-color:rgba(233,182,90,.28); border-left-color:var(--dream-red); }
  body[data-theme="dream"] .bout:nth-of-type(2n){ border-left-color:var(--dream-gold); }
  body[data-theme="dream"] .bout.correct{ border-left-color:var(--good); }
  body[data-theme="dream"] .bout.wrong{ border-left-color:var(--bad); }
  .ribbon{ display:block; width:calc(100% + 32px); margin:20px -16px 0; height:54px; }
  .balcony{ display:block; width:calc(100% + 32px); margin:22px -16px 0; height:58px; color:var(--iron); }
  .balcony .rail{ fill:var(--accent); opacity:.85; }

  /* ── Ladder match: drag the winner up the ladder ── */
  .ladder-wrap{ margin:14px 0 0; display:grid; grid-template-columns:1fr; justify-items:center; user-select:none; -webkit-user-select:none; }
  .ladder-top{ width:100%; display:flex; flex-direction:column; align-items:center; gap:8px; padding:12px; border:2px dashed var(--line);
               border-radius:12px; transition:border-color .15s, background .15s; min-height:118px; justify-content:center; }
  .ladder-top.has{ border-style:solid; border-color:var(--accent); }
  .ladder-top.over{ border-color:var(--accent); background:rgba(242,193,78,.10); }
  .case{ width:58px; height:44px; }
  .case .body{ fill:var(--accent); } .case .trim{ fill:var(--accent-ink); opacity:.55; } .case .hook{ stroke:var(--dim); }
  .ladder-hint{ font-size:14px; color:var(--dim); text-align:center; }
  .ladder{ position:relative; width:120px; height:150px; margin:-2px 0; }
  .ladder::before, .ladder::after{ content:""; position:absolute; top:0; bottom:0; width:8px; border-radius:3px; background:var(--dim); opacity:.6; }
  .ladder::before{ left:14px; transform:rotate(-2deg); } .ladder::after{ right:14px; transform:rotate(2deg); }
  .ladder .rungs{ position:absolute; left:20px; right:20px; top:10px; bottom:0;
                  background:repeating-linear-gradient(to bottom, transparent 0 22px, var(--dim) 22px 28px); opacity:.45; }
  .ladder-floor{ width:100%; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:12px 8px 4px;
                 border-top:3px solid var(--line); border-radius:2px; min-height:60px; }
  .lchip{ background:var(--surface2); border:1px solid var(--line); border-radius:999px; padding:10px 16px; font-weight:600; line-height:1.15;
          touch-action:none; cursor:grab; }
  .lchip:disabled{ cursor:default; touch-action:auto; }
  .lchip.picked{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-size:18px; padding:12px 20px; }
  .lchip.won{ box-shadow:0 0 0 2px var(--good); }
  .lchip.lifting{ opacity:.3; }
  .lghost{ position:fixed; z-index:70; pointer-events:none; transform:translate(-50%,-50%) rotate(-3deg) scale(1.06);
           background:var(--accent); color:var(--accent-ink); border-radius:999px; padding:10px 16px; font-weight:700;
           box-shadow:0 10px 30px rgba(0,0,0,.45); white-space:nowrap; }
  @media (prefers-reduced-motion: no-preference){
    .lchip.climbed{ animation:climb .45s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes climb{ from{ transform:translateY(180px); opacity:.2; } to{ transform:none; opacity:1; } }
  }
  body[data-theme="matchday"] .show-name{ font-size:clamp(48px, 13vw, 96px); line-height:0.95; }
  .show-sub{ font-family:var(--display); font-weight:600; font-size:clamp(26px,7vw,40px); line-height:1.1; margin:6px 0 0; color:var(--text); }
  body[data-theme="matchday"] .show-sub{ font-style:italic; font-weight:700; }
  .show-meta{ margin:14px 0 0; color:var(--dim); font-size:15px; }
  .lockline{ margin:16px 0 0; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:baseline; }
  .lockline .count{ font-family:var(--display); font-weight:800; font-size:30px; line-height:1; color:var(--text); font-variant-numeric:tabular-nums; }
  .lockline .why{ color:var(--dim); font-size:14px; }

  /* ── Who's picking ── */
  .whobar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:12px 14px; background:var(--surface); border:1px solid var(--line); border-radius:10px; }
  .whobar label{ color:var(--dim); font-size:14px; }
  .whobar select{ background:var(--surface2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-weight:600; }
  .progress{ flex:1; min-width:140px; display:flex; align-items:center; gap:10px; font-size:13px; color:var(--dim); }
  .progress .track{ display:block; flex:1; height:6px; background:var(--surface2); border-radius:3px; overflow:hidden; }
  .progress .fill{ display:block; height:100%; width:0; background:var(--accent); transition:width .25s; }

  /* ── Tabs ── */
  .tabs{ display:flex; gap:4px; margin:22px 0 14px; border-bottom:1px solid var(--line); }
  .tab{ background:none; border:0; border-bottom:3px solid transparent; padding:10px 12px; color:var(--dim); font-weight:600; margin-bottom:-1px; }
  .tab[aria-selected="true"]{ color:var(--text); border-bottom-color:var(--accent); }

  /* ── Results / finalise strip ── */
  .official{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:0 0 14px; font-size:14px; color:var(--dim); }
  .toggle{ background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:7px 14px; font-weight:600; font-size:14px; }
  .toggle[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .resultsmode-note{ background:var(--surface2); border:1px dashed var(--accent); border-radius:10px; padding:10px 14px; margin:0 0 14px; font-size:14px; }

  /* ── Bout cards ── */
  .bout{ background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:10px; padding:16px; margin:0 0 12px; }
  .bout.correct{ border-left-color:var(--good); }
  .bout.wrong{ border-left-color:var(--bad); }
  .bout h3{ font-family:var(--display); font-weight:800; font-size:26px; line-height:1.05; margin:0; }
  body[data-theme="matchday"] .bout h3{ font-size:22px; font-weight:700; }
  .stip{ color:var(--dim); font-size:14px; margin:4px 0 0; }
  .opts{ display:grid; gap:8px; margin:14px 0 0; grid-template-columns:repeat(2, minmax(0,1fr)); }
  .opts.n3{ grid-template-columns:repeat(3, minmax(0,1fr)); }
  @media (max-width:460px){ .opts.n3{ grid-template-columns:1fr; } }
  .opt{
    position:relative; text-align:left; background:var(--surface2); border:1px solid var(--line); border-radius:8px;
    padding:12px; font-weight:600; line-height:1.2; min-height:48px;
  }
  .opt:disabled{ cursor:default; }
  .opt .holder{ display:block; font-weight:500; font-size:12px; color:var(--dim); margin-top:3px; }
  .opt.picked{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .opt.picked .holder{ color:inherit; opacity:.75; }
  .opt.faded{ opacity:.5; }
  .opt.won{ box-shadow:inset 0 0 0 2px var(--good); }
  .other{ margin:10px 0 0; display:flex; gap:8px; align-items:center; font-size:14px; color:var(--dim); }
  .field{ width:100%; background:var(--surface2); border:1px solid var(--line); border-radius:8px; padding:11px 12px; }
  .field:disabled{ opacity:.7; }
  .outcome{ margin:12px 0 0; font-size:14px; color:var(--dim); }
  .outcome strong{ color:var(--text); }
  .outcome .hit{ color:var(--good); font-weight:600; }
  .outcome .miss{ color:var(--bad); font-weight:600; }
  .whopicked{ margin:12px 0 0; display:flex; flex-wrap:wrap; gap:6px; font-size:13px; }
  .whopicked span{ background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:3px 10px; color:var(--dim); }
  .whopicked span b{ color:var(--text); font-weight:600; }
  .section-head{ font-family:var(--display); font-weight:800; font-size:30px; margin:28px 0 12px; }
  .stepper{ display:flex; align-items:center; gap:10px; margin:14px 0 0; }
  .stepbtn{ width:44px; height:44px; border-radius:8px; background:var(--surface2); border:1px solid var(--line); font-size:20px; }
  .stepval{ font-family:var(--display); font-weight:800; font-size:34px; min-width:56px; text-align:center; font-variant-numeric:tabular-nums; }
  .stepval.unset{ color:var(--dim); }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 0; }
  .chip{ background:var(--surface2); border:1px solid var(--line); border-radius:999px; padding:9px 16px; font-weight:600; }
  .chip.picked{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .followlabel{ margin:12px 0 6px; font-size:14px; color:var(--dim); }
  .clear-row{ text-align:center; margin:22px 0 0; }
  .linkbtn{ background:none; border:0; color:var(--dim); text-decoration:underline; font-size:14px; }

  /* ── Table tab ── */
  .winner{ background:var(--accent); color:var(--accent-ink); border-radius:12px; padding:16px 18px; margin:0 0 16px; }
  .winner h3{ font-family:var(--display); font-weight:900; font-size:32px; line-height:1; margin:0 0 6px; }
  .winner p{ margin:0; font-size:15px; }
  .winner .linkbtn{ color:inherit; opacity:.8; padding:0; margin-top:8px; }
  .row{ display:grid; grid-template-columns:28px 1fr auto; align-items:center; gap:10px; padding:12px 14px; background:var(--surface); border:1px solid var(--line); border-radius:10px; margin:0 0 8px; }
  .row.top{ border-color:var(--accent); }
  .row .rank{ font-family:var(--display); font-weight:800; font-size:22px; color:var(--dim); text-align:center; }
  .row .nm{ font-weight:600; }
  .row .nm small{ font-weight:500; color:var(--dim); margin-left:6px; }
  .row .sc{ font-family:var(--display); font-weight:800; font-size:24px; font-variant-numeric:tabular-nums; }
  .row .meta{ color:var(--dim); font-size:14px; }
  .bot{ display:inline-block; font-size:12px; font-weight:600; padding:1px 7px; border-radius:999px; border:1px solid var(--line); color:var(--dim); margin-left:6px; vertical-align:2px; }
  .note{ color:var(--dim); font-size:14px; margin:10px 0; }
  .empty{ background:var(--surface); border:1px dashed var(--line); border-radius:10px; padding:18px; color:var(--dim); text-align:center; }
  .compare{ margin:24px 0 0; }
  .compare-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .compare-head select{ background:var(--surface2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-weight:600; }
  .diff{ display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; padding:10px 12px; border-bottom:1px solid var(--line); font-size:14px; }
  .diff .mine{ font-weight:600; }
  .diff .lbl{ color:var(--dim); font-size:12px; text-align:center; max-width:150px; }
  .diff .theirs{ font-weight:600; text-align:right; }
  .reasons{ margin:24px 0 0; }
  .reason{ padding:12px 0; border-bottom:1px solid var(--line); }
  .reason .q{ color:var(--dim); font-size:13px; }
  .reason .a{ font-weight:600; }
  .reason .why{ font-style:italic; color:var(--text); opacity:.85; font-size:15px; margin-top:2px; }

  /* ── Home ── */
  .home-title{ font-family:var(--display); font-weight:900; font-size:clamp(56px,16vw,112px); line-height:.86; margin:28px 0 8px; }
  .home-sub{ color:var(--dim); margin:0 0 24px; max-width:52ch; }
  .ev{ display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; text-decoration:none; color:var(--text);
       padding:14px 16px; border:1px solid var(--line); border-radius:12px; background:var(--surface); margin:0 0 10px; }
  .ev:hover{ border-color:var(--dim); }
  .ev .swatch{ width:10px; align-self:stretch; border-radius:5px; }
  .ev .t{ font-family:var(--display); font-weight:800; font-size:28px; line-height:1; }
  .ev .m{ color:var(--dim); font-size:14px; margin-top:4px; }
  .ev .s{ font-size:14px; color:var(--dim); text-align:right; }
  .ev .s b{ color:var(--text); display:block; }
  .ev.upcoming{ border-color:var(--accent); }
  .season{ margin:28px 0 0; }

  /* ── Avatars + who's picking ── */
  .av{ --s:44px; width:var(--s); height:var(--s); border-radius:50%; flex:none; display:inline-grid; place-items:center; overflow:hidden;
       background:var(--surface2); border:2px solid var(--line); font-weight:700; font-size:calc(var(--s) * .38); color:var(--text); }
  .av img{ width:100%; height:100%; object-fit:cover; display:block; }
  .pickers{ display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  .picker{ background:none; border:0; padding:0; display:flex; flex-direction:column; align-items:center; gap:5px; font-size:13px; color:var(--dim); width:64px; }
  .picker .av{ --s:56px; transition:transform .12s; }
  .picker[aria-checked="true"]{ color:var(--text); font-weight:700; }

            gap:1.6em 2.4em; padding:2.2em 3em 1.6em; }

  .tv-done{ flex:1; display:flex; flex-direction:column; justify-content:center; }

    @keyframes slam{ from{ transform:scale(1.8); opacity:0; } to{ transform:none; opacity:1; } }
  }
  .tv-ctl{ position:fixed; right:1.2em; bottom:1.2em; z-index:45; display:flex; gap:.6em; font-size:min(1.7vh, .95vw); transition:opacity .4s; }

  <rect class="body" x="3" y="12" width="52" height="30" rx="5"/>

const LEAGUE = [
  { key:"josh",  name:"Josh"  },
  { key:"maria", name:"Maria" },
  { key:"erik",  name:"Erik"  },
  { key:"ryan",  name:"Ryan", bot:true },

const LEAGUE_KEYS = LEAGUE.map(p=>p.key);
const THEME_SWATCH = { dream:"#d3243a", nola:"#8b5cc4", briefcase:"#d9a93a", matchday:"#c8102e", ringside:"#e9c46a" };

// ── small helpers ──────────────────────────────────────────────────────────
const $ = (s, r=document)=>r.querySelector(s);
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function norm(v){ return (v==null?"":String(v)).trim().toLowerCase().replace(/\s+/g," "); }
function arrayOf(v){ return Array.isArray(v) ? v : (v && typeof v==="object" ? Object.values(v) : []); }
function blank(v){ return v===undefined || v===null || v===""; }
function slug(s){ return norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "guest"; }
function nameFor(key, entry){ const l = LEAGUE.find(p=>p.key===key); return l ? l.name : ((entry && entry.name) || (typeof GUESTS!=="undefined" && GUESTS[key]) || key); }
function fmtDate(iso, opts){ try{ return new Date(iso).toLocaleString(undefined, opts); }catch(e){ return iso; } }
function shortDate(iso){ return fmtDate(iso, { month:"short", day:"numeric" }); }
function toast(msg){
  const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role","status"); el.textContent = msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(), 2600);
}
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function withinMs(p, ms){ return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error("No answer from the database in "+(ms/1000)+"s")), ms))]); }
async function getJSON(url){
  const r = await fetch(url + (url.indexOf("?")<0?"?":"&") + "t=" + Date.now(), { cache:"no-store" });
  if(!r.ok) throw new Error(r.status===404 ? "not found" : "HTTP "+r.status);
  return r.json();
}

// ── Firebase ───────────────────────────────────────────────────────────────
let db = null, dbReady = null;
function initDb(){
  if(dbReady) return dbReady;
  dbReady = (async ()=>{
    if(!window.firebase) throw new Error("The Firebase scripts did not load — check the connection and reload.");
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    await withinMs(firebase.auth().signInAnonymously(), 15000);
    bindPhotos();
    db.ref(".info/connected").on("value", s=>{
      const on = s.val()===true;
      const el = $("#live"); el.textContent = on ? "Live" : "Offline"; el.className = "live " + (on?"ok":"err");
    });
    return db;
  })();
  dbReady.catch(e=>{ const el=$("#live"); el.textContent="Offline"; el.className="live err"; console.error(e); });
  return dbReady;
}

// ── Player photos ──────────────────────────────────────────────────────────
let PHOTOS = {};
let GUESTS = {};      // saved guest players: key → name. They play every show but never win a swap token.
function guestKey(n){ return "g_" + slug(n); }
// Save a guest to the shared player list (keeps any photo already there).
async function saveGuest(n){
  const name = String(n||"").trim(); if(!name) return null;
  const k = slug(name);
  if(LEAGUE_KEYS.indexOf(k)!==-1) return k;
  await initDb();
  await withinMs(db.ref(PLAYER_PATH+"/"+guestKey(name)).update({ name, guest:true }), 10000);
  GUESTS[guestKey(name)] = name;
  return guestKey(name);
}
let photosBound = false;
function bindPhotos(){
  if(photosBound || !db) return; photosBound = true;
  db.ref(PLAYER_PATH).on("value", snap=>{
    const v = snap.val() || {}; PHOTOS = {}; GUESTS = {};
    Object.keys(v).forEach(k=>{
      if(v[k] && v[k].photo) PHOTOS[k] = v[k].photo;
      if(v[k] && v[k].guest && v[k].name && LEAGUE_KEYS.indexOf(k)===-1) GUESTS[k] = v[k].name;
    });
    if(view && view.repaint) view.repaint();
  }, ()=>{ photosBound = false; });
}
function initials(n){ return String(n||"?").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase(); }
function avatar(key, name, cls){
  const src = PHOTOS[key];
  return `<span class="av ${cls||""}">${src ? `<img src="${esc(src)}" alt="">` : esc(initials(name))}</span>`;
}

// ── Cards: the repo's events/ files, overridden by anything saved on the setup page ──
const CARD_CACHE = {};
function parseDef(v){ try{ const d = typeof v==="string" ? JSON.parse(v) : v; return d && typeof d==="object" ? d : null; }catch(e){ return null; } }
async function fbCards(ms){
  await withinMs(initDb(), ms || 6000);
  const v = (await withinMs(db.ref(CARD_PATH).once("value"), ms || 6000)).val() || {};
  const out = {}; Object.keys(v).forEach(k=>{ const d = parseDef(v[k]); if(d) out[k] = d; });
  return out;
}
let INDEX = null;
let view = null;      // teardown/repaint hooks of whatever is on screen
async function loadIndex(){
  if(!INDEX) INDEX = (await getJSON("events/index.json")).events || [];
  return INDEX;
}
// Every show: repo list merged with setup-page cards (which win), minus deleted ones.
async function allEvents(){
  const repo = await loadIndex();
  let fb = {};
  try{ fb = await fbCards(5000); }catch(e){}
  const byId = {};
  repo.forEach(e=>{ byId[e.id] = Object.assign({ fromRepo:true }, e); });
  Object.keys(fb).forEach(id=>{
    if(fb[id].deleted){ delete byId[id]; return; }
    const d = fb[id];
    byId[id] = Object.assign({}, byId[id] || {}, { id, name:d.name, subtitle:d.subtitle, promotion:d.promotion, start:d.start, date:(d.start||"").slice(0,10), theme:d.theme, legacy:!!d.legacySheet, edited:true });
  });
  return Object.values(byId).sort((a,b)=> new Date(b.start) - new Date(a.start));
}
async function loadCard(id){
  const repoP = getJSON("events/"+id+".json").catch(()=>null);
  let fb = null;
  try{ const v = (await withinMs((async()=>{ await initDb(); return db.ref(CARD_PATH+"/"+id).once("value"); })(), 5000)).val(); fb = v ? parseDef(v) : null; }catch(e){}
  if(fb && fb.deleted) return null;
  return fb || await repoP;
}
function route(){
  if(view && view.teardown) view.teardown();
  view = null;
  const m = location.hash.match(/^#\/?([a-z0-9-]+)(?:\/([a-z0-9-]+))?/i);
  const id = m ? m[1] : "";
  window.scrollTo(0,0);
  if(id==="setup") showSetup(m[2] || "");
  else if(id && m[2]==="tv") showTV(id);
  else if(id) showEvent(id); else showHome();
}
window.addEventListener("hashchange", route);

// ════════════════════════════════════════════════════════════════════════════
// Scoring — shared by the event page and the home page's season table.
// ════════════════════════════════════════════════════════════════════════════
function bonusKey(q){ return q.key || q.id; }
// A saved answer only counts if it still fits the question (questions can be edited after people pick).
function fits(q, v){
  if(blank(v)) return false;
  if(q.type==="number") return v!==true && v!==false && String(v).trim()!=="" && isFinite(Number(v));
  if(q.type==="choice") return (q.options||[]).some(o=>norm(o)===norm(v));
  return true;
}
function bonusAnswered(q, p){ return fits(q, p[bonusKey(q)]); }
function answeredCount(ev, p){
  return ev.bouts.filter(b=>!blank(p[b.id])).length + (ev.bonus||[]).filter(q=>bonusAnswered(q,p)).length;
}
function totalQs(ev){ return ev.bouts.length + (ev.bonus||[]).length; }
// Party picks: one round per match, then every bonus question together as the last round.
function partyRounds(ev){
  const r = ev.bouts.map(b=>({ kind:"bout", id:b.id, title:b.title, stip:b.stip, b }));
  if((ev.bonus||[]).length) r.push({ kind:"bonus", id:"__bonus", title:"Bonus questions", stip:"All of them at once — they break ties" });
  return r;
}

// Score one card. `everyone` is every card on the show, for closest-guess questions.
function scoreCard(ev, p, results, everyone){
  // bonus = points from bonus questions alone; it breaks ties on the total.
  let correct = 0, graded = 0, bonus = 0;
  ev.bouts.forEach(b=>{
    if(blank(results[b.id])) return;
    graded++;
    if(!blank(p[b.id]) && norm(p[b.id])===norm(results[b.id])) correct++;
  });
  (ev.bonus||[]).forEach(q=>{
    const k = bonusKey(q), actual = results[k];
    if(q.type==="number"){
      if(blank(actual)) return;
      graded++;
      const a = Number(actual);
      const guesses = everyone.map(x=>x[k]).filter(v=>fits(q,v)).map(Number);
      if(fits(q, p[k]) && guesses.length){
        const best = Math.min.apply(null, guesses.map(g=>Math.abs(g-a)));
        const mine = Math.abs(Number(p[k])-a);
        if(mine===best){ correct++; bonus++; }
      }
      return;
    }
    if(!blank(actual)){
      graded++;
      if(fits(q, p[k]) && norm(p[k])===norm(actual)){ correct++; bonus++; }
    }
    if(q.followUp && !blank(results[q.followUp.key])){
      graded++;
      if(norm(p[q.followUp.key])===norm(results[q.followUp.key])){ correct++; bonus++; }
    }
  });
  return { correct, graded, bonus };
}

// players: [{key, name, picks, bot}] → sorted standings
function standings(ev, players, results){
  const everyone = players.map(p=>p.picks||{});
  return players.map(p=>{
    const s = scoreCard(ev, p.picks||{}, results, everyone);
    return Object.assign({}, p, s, { answered: answeredCount(ev, p.picks||{}) });
  }).sort((a,b)=> b.correct-a.correct || b.bonus-a.bonus || a.name.localeCompare(b.name));
}

// Only one swap token per show: best league member, then most bonus points, then a shared token if still level.
function tokenWinners(table){
  const league = table.filter(r=>LEAGUE_KEYS.indexOf(r.key)!==-1 && r.answered>0);
  if(!league.length) return [];
  const top = league[0];
  return league.filter(r=>r.correct===top.correct && r.bonus===top.bonus).map(r=>r.key);
}

// ════════════════════════════════════════════════════════════════════════════
// Home
// ════════════════════════════════════════════════════════════════════════════
async function showHome(){
  document.body.dataset.theme = "ringside";
  document.title = "Prediction Sheet";
  $("#homeLink").classList.add("hidden");
  const app = $("#app");
  app.innerHTML = `
    <h1 class="home-title">Call the card</h1>
    <p class="home-sub">Pick every match before the bell. Whoever in the league calls the most on the night gets a swap token in AEW Fantasy.</p>
    <div id="evList"><div class="empty">Loading the shows…</div></div>
    <section class="season" id="season"></section>
    <a class="setup-link" href="#/setup">Set up shows, matches and player photos</a>`;
  let events;
  try{ events = await allEvents(); }
  catch(e){ $("#evList").innerHTML = `<div class="empty">Couldn't load the list of shows (${esc(e.message)}). Reload to try again.</div>`; return; }

  let finals = {};
  const paint = ()=>{
    const now = Date.now();
    $("#evList").innerHTML = events.map(e=>{
      const start = new Date(e.start).getTime();
      const upcoming = start > now;
      const fin = finals[e.id];
      let status;
      if(fin && fin.winners && fin.winners.length) status = `<b>${esc(fin.winners.map(k=>nameFor(k)).join(" & "))}</b>won it`;
      else if(upcoming) status = `<b>${esc(lockCountdown(start))}</b>until picks lock`;
      else if(e.legacy) status = `<b>Archived</b>sheet-era show`;
      else status = `<b>Picks locked</b>results pending`;
      return `<a class="ev ${upcoming?"upcoming":""}" href="#/${esc(e.id)}">
        <span class="swatch" style="background:${THEME_SWATCH[e.theme]||"var(--accent)"}"></span>
        <span><span class="t">${esc(e.name)}${e.subtitle? " "+esc(e.subtitle):""}</span>
        <span class="m" style="display:block">${esc(e.promotion)} · ${esc(fmtDate(e.start,{weekday:"short",month:"short",day:"numeric"}))}</span></span>
        <span class="s">${status}</span></a>`;
    }).join("");
    const wins = {}; LEAGUE.forEach(p=>wins[p.key]=0);
    let shows = 0;
    Object.keys(finals).forEach(id=>{ const w = finals[id] && finals[id].winners; if(w && w.length){ shows++; w.forEach(k=>{ if(k in wins) wins[k]++; }); } });
    $("#season").innerHTML = shows ? `<h2 class="section-head">Swap tokens won</h2>` +
      LEAGUE.slice().sort((a,b)=>wins[b.key]-wins[a.key] || a.name.localeCompare(b.name)).map((p,i)=>
        `<div class="row ${i===0&&wins[p.key]>0?"top":""}"><span class="rank">${i+1}</span>
          <span class="who">${avatar(p.key, p.name)}<span class="nm">${esc(p.name)}${p.bot?'<span class="bot">RyAI picks</span>':""}</span></span>
          <span class="sc">${wins[p.key]}</span></div>`).join("") : "";
  };
  paint();
  const tick = setInterval(paint, 30000);
  let ref = null;
  view = { teardown(){ clearInterval(tick); if(ref) ref.off(); }, repaint: ()=>paint() };
  try{
    await initDb();
    if(!view) return;
    ref = db.ref(PRED_ROOT);
    ref.on("value", snap=>{
      const all = snap.val() || {};
      finals = {}; Object.keys(all).forEach(id=>{ if(all[id] && all[id].final){ finals[id] = all[id].final; finals[id].winners = arrayOf(finals[id].winners); } });
      paint();
    }, err=>console.error(err));
  }catch(e){ /* the list still works without the database */ }
}

function lockCountdown(start){
  let mins = Math.ceil(Math.max(0, start - Date.now())/60000);
  const d = Math.floor(mins/1440); mins -= d*1440;
  const h = Math.floor(mins/60);
  const m = mins - h*60;
  if(d) return d+"d "+h+"h";
  if(h) return h+"h "+m+"m";
  return m+"m";
}

// ════════════════════════════════════════════════════════════════════════════
// Event page
// ════════════════════════════════════════════════════════════════════════════
async function showEvent(id, carry){
  $("#homeLink").classList.remove("hidden");
  const app = $("#app");
  if(!carry) app.innerHTML = `<div class="empty" style="margin-top:24px">Loading the card…</div>`;
  let ev = CARD_CACHE[id] || await loadCard(id);
  if(!ev){ app.innerHTML = `<div class="empty" style="margin-top:24px">There's no show called “${esc(id)}”. <a href="#/">See all shows</a>.</div>`; return; }
  if(!ev.id) ev.id = id;
  const evStr = JSON.stringify(ev);

  const S = {
    ev, start: new Date(ev.start).getTime(),
    me: lsGet("pred_me") || "",
    picks: {},            // key → { name, picks, updatedAt }
    results: {}, final: null,
    ryan: null, ryanErr: "",
    legacy: !!ev.legacySheet,
    resultsMode: !!(carry && carry.resultsMode), tab: (carry && carry.tab) || "card",
    saveTimer: null, resultsTimer: null, pendingMine: null, pendingResults: null,
    ref: null, tick: null, dead: false, party: null, partyShell: "",
  };
  const base = PRED_ROOT + "/" + ev.id;
  view = { teardown(){ S.dead = true; if(S.ref) S.ref.off(); if(S.cardRef) S.cardRef.off(); clearInterval(S.tick); flushSaves(); }, repaint: ()=>renderAll() };

  document.body.dataset.theme = ev.theme || "ringside";
  document.title = ev.name + (ev.subtitle? " "+ev.subtitle:"") + " — Prediction Sheet";
  $("#rosterList").innerHTML = (ev.roster||[]).map(n=>`<option value="${esc(n)}"></option>`).join("");

  // ── derived ──
  const locked = ()=> Date.now() >= S.start;
  const myKey = ()=> S.me;
  const myPicks = ()=>{
    if(!S.me) return {};
    if(!S.picks[S.me]) S.picks[S.me] = { name: nameFor(S.me), picks:{} };
    if(!S.picks[S.me].picks) S.picks[S.me].picks = {};
    return S.picks[S.me].picks;
  };
  // Ryan's card is RyAI's picks with anything Ryan picked himself on top.
  const botPicks = ()=> (S.ryan && S.ryan.picks) || {};
  const ryanOwn = ()=> (S.picks.ryan && S.picks.ryan.picks) || {};
  const ryanChanged = ()=>{ const b = botPicks(), o = ryanOwn(); return Object.keys(o).filter(k=>!blank(o[k]) && norm(o[k])!==norm(b[k])); };
  const target = ()=>{
    if(S.resultsMode) return S.results;
    const t = myPicks();
    // When Ryan opens his card, start from RyAI's picks so he only changes what he disagrees with.
    if(S.me==="ryan" && !S.legacy){ const b = botPicks(); Object.keys(b).forEach(k=>{ if(blank(t[k])) t[k] = b[k]; }); }
    return t;
  };
  // ── party picks (started from the TV) ──
  const ROUNDS = partyRounds(ev);
  const partyLive = ()=>{ const P = S.party; return !!(P && P.on && !P.done && !locked() && !S.legacy && !S.resultsMode); };
  const pRound = ()=> S.party && typeof S.party.round==="number" ? S.party.round : -1;
  const pJoined = ()=> Object.keys((S.party && S.party.players) || {});
  const pLocks = ()=> (S.party && S.party.locks && S.party.locks[pRound()]) || {};
  const pRevealed = ()=> !!(S.party && S.party.revealed && S.party.revealed[pRound()]);
  const myLock = ()=> !!pLocks()[S.me];
  const partyKeys = ()=>{ const R = ROUNDS[pRound()]; return new Set(R ? [R.id] : []); };
  const roundDone = ()=>{
    const R = ROUNDS[pRound()]; if(!R) return false; const t = target();
    return R.kind==="bout" ? !blank(t[R.id]) : (ev.bonus||[]).every(q=>bonusAnswered(q, t));
  };
  const canEdit = ()=> !S.legacy && (S.resultsMode ? !S.final : (!!S.me && !locked() && !(partyLive() && (pRound()<0 || myLock() || pRevealed() || !S.party.players || !S.party.players[S.me]))));
  function players(){
    const list = [];
    Object.keys(S.picks).forEach(k=>{
      if(k==="ryan" && !S.legacy) return;
      const e = S.picks[k]; if(!e || !e.picks || !Object.keys(e.picks).length) return;
      list.push({ key:k, name:nameFor(k,e), picks:e.picks });
    });
    if(!S.legacy){
      const merged = Object.assign({}, botPicks());
      const own = ryanOwn(); Object.keys(own).forEach(k=>{ if(!blank(own[k])) merged[k] = own[k]; });
      if(Object.keys(merged).length) list.push({ key:"ryan", name:"Ryan", picks:merged, bot: ryanChanged().length===0, mixed: ryanChanged().length>0 && !!S.ryan });
    }
    return list;
  }
  // Tag on a question when Ryan is looking at a pick RyAI made for him
  function botTag(k){
    if(S.me!=="ryan" || S.resultsMode || !S.ryan) return "";
    const b = botPicks()[k], t = myPicks()[k];
    if(blank(b)) return "";
    return norm(b)===norm(t) ? `<p class="stip">🤖 RyAI picked this — change it if you like</p>` : `<p class="stip">You changed this from RyAI's pick (${esc(b)})</p>`;
  }

  // ── shell ──
  app.innerHTML = `
    <header class="hero">
      <p class="promo">${esc(ev.promotion)}</p>
      <h1 class="show-name">${ev.theme==="nola" ? esc(ev.name).replace(/^(\S+)\s+(in the|of the|at the|in|of|at)\s+(.+)$/i, '$1<span class="joiner">$2</span>$3') : esc(ev.name)}</h1>
      ${ev.subtitle? `<p class="show-sub">${esc(ev.subtitle)}</p>`:""}
      <p class="show-meta">${esc(fmtDate(ev.start,{weekday:"long",month:"long",day:"numeric"}))}${ev.legacy||ev.legacySheet?"":" · "+esc(fmtDate(ev.start,{hour:"numeric",minute:"2-digit"}))}${ev.venue? " · "+esc(ev.venue):""}</p>
      <div class="lockline" id="lockline"></div>
      ${ev.legacySheet ? "" : `<a class="tvlink" href="#/${esc(ev.id)}/tv">📺 Party mode — put this on the TV</a>`}
      ${ev.theme==="nola" ? NOLA_BALCONY : ev.theme==="dream" ? DREAM_RIBBON : ""}
    </header>
    <div class="whobar" id="whobar"></div>
    <section id="panel-party" class="party hidden"></section>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="card" aria-selected="${S.tab==="card"}">The card</button>
      <button class="tab" role="tab" data-tab="table" aria-selected="${S.tab==="table"}">League table</button>
    </div>
    <section id="panel-card" class="${S.tab==="card"?"":"hidden"}"></section>
    <section id="panel-table" class="${S.tab==="table"?"":"hidden"}"></section>
    <a class="setup-link" href="#/setup/${esc(ev.id)}">Edit this show's card</a>`;
  app.querySelectorAll(".tab").forEach(t=>t.addEventListener("click", ()=>{
    S.tab = t.dataset.tab;
    app.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected", String(x===t)));
    $("#panel-card").classList.toggle("hidden", S.tab!=="card");
    $("#panel-table").classList.toggle("hidden", S.tab!=="table");
    renderAll();
  }));

  // ── render: lock line ──
  function renderLock(){
    const el = $("#lockline"); if(!el) return;
    if(S.legacy){ el.innerHTML = `<span class="why">From the old sheet — read-only.${ev.legacyPage? ` <a href="${esc(ev.legacyPage)}">Open the original page</a>.`:""}</span>`; return; }
    if(S.final && S.final.winners && S.final.winners.length){
      el.innerHTML = `<span class="count">Final</span><span class="why">${esc(S.final.winners.map(k=>nameFor(k)).join(" & "))} took the swap token</span>`; return;
    }
    if(locked()){ el.innerHTML = `<span class="count">Bell's rung</span><span class="why">Picks are locked. Results go in as they happen.</span>`; return; }
    el.innerHTML = `<span class="count">${esc(lockCountdown(S.start))}</span><span class="why">until picks lock at ${esc(fmtDate(ev.start,{hour:"numeric",minute:"2-digit"}))}</span>`;
  }

  // ── render: who's picking ──
  function renderWho(){
    const el = $("#whobar"); if(!el) return;
    if(S.legacy){ el.innerHTML = `<span class="note" style="margin:0">Cards from the old sheet are shown as they were saved.</span>`; return; }
    el.classList.add("photos");
    const guests = Object.keys(S.picks).filter(k=>LEAGUE_KEYS.indexOf(k)===-1);
    Object.keys(GUESTS).sort((a,b)=>GUESTS[a].localeCompare(GUESTS[b])).forEach(k=>{ if(guests.indexOf(k)===-1) guests.push(k); });
    const people = LEAGUE.map(p=>({ key:p.key, name:p.name })).concat(guests.map(k=>({ key:k, name:nameFor(k,S.picks[k]) })));
    const p = target(), done = answeredCount(ev, p), tot = totalQs(ev);
    el.innerHTML = `<div class="head"><span>${S.me ? "Picking as" : "Who's picking? Tap your face."}</span></div>
      <div class="pickers" role="radiogroup" aria-label="Who's picking">` +
      people.map(x=>`<button class="picker" role="radio" aria-checked="${S.me===x.key}" data-me="${esc(x.key)}">${avatar(x.key, x.name)}<span>${esc(x.name)}</span></button>`).join("") +
      `<button class="picker" data-me="__new" aria-label="Add a guest"><span class="av add">+</span><span>Guest</span></button></div>
      <span class="progress"><span class="track"><span class="fill" style="width:${tot?done/tot*100:0}%"></span></span>
      <span>${done} of ${tot} ${S.resultsMode?"results in":"called"}</span></span>`;
    el.querySelectorAll("[data-me]").forEach(b=>b.addEventListener("click", ()=>{
      let v = b.dataset.me;
      if(v==="__new"){
        const n = (prompt("Guest's name? They'll be saved for every show, but can't win a swap token.")||"").trim();
        if(!n) return;
        const k = slug(n);
        if(LEAGUE_KEYS.indexOf(k)!==-1){ v = k; }
        else { v = "g_"+k; if(!S.picks[v]) S.picks[v] = { name:n, picks:{} }; saveGuest(n).catch(()=>{}); }
      }
      flushSaves();
      S.me = v; lsSet("pred_me", v); renderAll();
    }));
  }

  // ── render: the card ──
  function renderCard(){
    const party = partyLive();
    const el = party ? $("#partyBody") : $("#panel-card"); if(!el) return;
    if(!party && S.tab!=="card") return;
    const only = party ? partyKeys() : null;
    if(S.dragging || (el.contains(document.activeElement) && document.activeElement.tagName==="INPUT")) { S.deferred = true; return; }
    const t = target(), mine = myPicks(), edit = canEdit(), showResults = !S.resultsMode;
    const others = locked() || S.legacy ? players() : [];
    let html = "";
    if(!S.legacy && !S.final && !only){
      html += `<div class="official"><span>${S.final? "Results are final." : "Watching live? Put the results in as they happen."}</span>
        <button class="toggle" id="resToggle" aria-pressed="${S.resultsMode}">${S.resultsMode?"Done entering results":"Enter results"}</button></div>`;
      if(S.resultsMode) html += `<div class="resultsmode-note">You're entering the official results — everyone sees these. Tap a winner again to clear it.</div>`;
      else if(!S.me) html += `<div class="resultsmode-note">Choose who's picking above, then call the card.</div>`;
    }
    ev.bouts.forEach(b=>{
      if(only && !only.has(b.id)) return;
      const chosen = t[b.id], actual = S.results[b.id], my = mine[b.id];
      let cls = "bout";
      if(showResults && !blank(actual) && !blank(my)) cls += norm(actual)===norm(my) ? " correct" : " wrong";
      const n = b.options.length;
      if(b.display==="ladder"){
        html += `<article class="${cls}"><h3>${esc(b.title)}</h3>${b.stip?`<p class="stip">${esc(b.stip)}</p>`:""}${botTag(b.id)}` + ladderHTML(b, chosen, actual, edit, showResults);
      } else
      html += `<article class="${cls}"><h3>${esc(b.title)}</h3>${b.stip?`<p class="stip">${esc(b.stip)}</p>`:""}${botTag(b.id)}
        <div class="opts ${n===3?"n3":""}">` +
        b.options.map(o=>{
          const picked = !blank(chosen) && norm(chosen)===norm(o.n);
          const faded = !blank(chosen) && !picked;
          const won = showResults && !blank(actual) && norm(actual)===norm(o.n);
          return `<button class="opt ${picked?"picked":""} ${faded?"faded":""} ${won?"won":""}" data-bout="${esc(b.id)}" data-name="${esc(o.n)}" ${edit?"":"disabled"} aria-pressed="${picked}">
            ${esc(o.n)}${o.c?`<span class="holder">Champion</span>`:""}</button>`;
        }).join("") + `</div>`;
      if(b.allowOther){
        const isOther = !blank(chosen) && !b.options.some(o=>norm(o.n)===norm(chosen));
        html += `<div class="other"><input class="field" data-other="${esc(b.id)}" list="rosterList" placeholder="Or name a surprise winner" value="${isOther?esc(chosen):""}" ${edit?"":"disabled"}></div>`;
      }
      if(showResults && !blank(actual)){
        const hit = !blank(my) && norm(my)===norm(actual);
        html += `<p class="outcome">Winner: <strong>${esc(actual)}</strong>${blank(my)?"":` — <span class="${hit?"hit":"miss"}">${hit?"you called it":"missed"}</span>`}</p>`;
      }
      if(others.length) html += whoPicked(others, b.id);
      html += `</article>`;
    });
    if((ev.bonus||[]).length && (!only || only.has("__bonus"))){
      if(!only) html += `<h2 class="section-head">Bonus questions</h2>`;
      ev.bonus.forEach(q=>{ html += bonusHTML(q, t, mine, edit, showResults, others); });
    }
    if(only){}
    else if(edit && !S.resultsMode && S.me==="ryan" && S.ryan) html += `<div class="clear-row"><button class="linkbtn" id="botBtn">Go back to RyAI's picks</button></div>`;
    else if(edit && !S.resultsMode) html += `<div class="clear-row"><button class="linkbtn" id="clearBtn">Clear my card</button></div>`;
    el.innerHTML = html;
    wireCard(el);
  }

  function ladderHTML(b, chosen, actual, edit, showResults){
    const top = b.options.find(o=>!blank(chosen) && norm(o.n)===norm(chosen));
    const chip = (o, isTop)=>{
      const won = showResults && !blank(actual) && norm(actual)===norm(o.n);
      const climbed = isTop && S.justClimbed===b.id;
      return `<button class="lchip ${isTop?"picked":""} ${won?"won":""} ${climbed?"climbed":""}" data-lbout="${esc(b.id)}" data-name="${esc(o.n)}"
        ${edit?"":"disabled"} aria-pressed="${isTop}" aria-label="${esc(o.n)}${isTop?" — your winner. Drag down or tap to clear":" — drag to the top or tap to pick"}">${esc(o.n)}</button>`;
    };
    const who = S.resultsMode ? "the winner" : "your winner";
    return `<div class="ladder-wrap" data-ladder="${esc(b.id)}">
      <div class="ladder-top ${top?"has":""}" data-drop="${esc(b.id)}">${BRIEFCASE_SVG}
        ${top ? chip(top, true) : `<span class="ladder-hint">${edit? `Drag ${who} up here` : "No pick"}</span>`}</div>
      <div class="ladder" aria-hidden="true"><div class="rungs"></div></div>
      <div class="ladder-floor">${b.options.filter(o=>o!==top).map(o=>chip(o,false)).join("")}</div>
    </div>`;
  }

  // Drag a ladder chip to the briefcase (or back down). A tap or Enter does the same.
  function wireLadders(el){
    let drag = null, suppressClick = false;
    const setPick = (bid, name)=>{ const t = target(); const was = t[bid]; t[bid] = name; S.justClimbed = name && norm(was)!==norm(name) ? bid : null; changed(); S.justClimbed = null; };
    el.querySelectorAll(".lchip:not([disabled])").forEach(chip=>{
      const bid = chip.dataset.lbout, name = chip.dataset.name;
      const isTop = chip.classList.contains("picked");
      chip.addEventListener("click", ()=>{
        if(suppressClick){ suppressClick = false; return; }
        setPick(bid, isTop ? null : name);
      });
      chip.addEventListener("pointerdown", e=>{
        if(e.button!==0) return;
        S.dragging = true;
        drag = { chip, bid, name, isTop, x:e.clientX, y:e.clientY, moving:false, ghost:null, zone: el.querySelector(`[data-drop="${CSS.escape(bid)}"]`) };
        try{ chip.setPointerCapture(e.pointerId); }catch(_){}
      });
      chip.addEventListener("pointermove", e=>{
        if(!drag || drag.chip!==chip) return;
        if(!drag.moving){
          if(Math.hypot(e.clientX-drag.x, e.clientY-drag.y) < 6) return;
          drag.moving = true;
          drag.ghost = document.createElement("div"); drag.ghost.className = "lghost"; drag.ghost.textContent = name;
          document.body.appendChild(drag.ghost); chip.classList.add("lifting");
        }
        e.preventDefault();
        drag.ghost.style.left = e.clientX+"px"; drag.ghost.style.top = e.clientY+"px";
        const r = drag.zone.getBoundingClientRect();
        drag.over = e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top-10 && e.clientY<=r.bottom;
        drag.zone.classList.toggle("over", drag.over);
      });
      const end = (cancel)=>{
        if(!drag || drag.chip!==chip) return;
        const d = drag; drag = null;
        S.dragging = false;
        const flush = ()=>{ if(S.deferred){ S.deferred = false; renderAll(); } };
        if(!d.moving){ setTimeout(flush, 0); return; }   // a plain tap: the click handler takes it
        suppressClick = true; setTimeout(()=>{ suppressClick = false; }, 400);
        d.ghost.remove(); chip.classList.remove("lifting"); d.zone.classList.remove("over");
        if(!cancel && d.over && !d.isTop) setPick(d.bid, d.name);
        else if(!cancel && !d.over && d.isTop) setPick(d.bid, null);
        flush();
      };
      chip.addEventListener("pointerup", ()=>end(false));
      chip.addEventListener("pointercancel", ()=>end(true));
    });
  }

  function whoPicked(list, key){
    const q = (ev.bonus||[]).find(x=>bonusKey(x)===key);
    const groups = {};
    list.forEach(p=>{ const v = p.picks[key]; if(blank(v) || (q && !fits(q, v))) return; const k = norm(v); (groups[k] = groups[k] || { label:v, who:[] }).who.push(p.name + (p.bot?" 🤖":"")); });
    const keys = Object.keys(groups); if(!keys.length) return "";
    return `<div class="whopicked">` + keys.map(k=>`<span><b>${esc(groups[k].label)}</b> ${esc(groups[k].who.join(", "))}</span>`).join("") + `</div>`;
  }

  function bonusHTML(q, t, mine, edit, showResults, others){
    const k = bonusKey(q), actual = S.results[k];
    // Drop an answer given to an older version of this question (e.g. Yes/No on what is now a number)
    if(q.type!=="text" && !blank(t[k]) && !fits(q, t[k])) delete t[k];
    const my = fits(q, mine[k]) ? mine[k] : null;
    let cls = "bout", body = "";
    if(q.type==="text"){
      body += `<input class="field" style="margin-top:14px" data-bonus="${esc(k)}" list="rosterList" placeholder="${esc(q.placeholder||"Your answer")}" value="${esc(t[k]||"")}" ${edit?"":"disabled"}>`;
      if(showResults && !blank(actual)){
        const hit = !blank(my) && norm(my)===norm(actual);
        if(!blank(my)) cls += hit?" correct":" wrong";
        body += `<p class="outcome">Answer: <strong>${esc(actual)}</strong>${blank(my)?"":` — <span class="${hit?"hit":"miss"}">${hit?"you called it":"missed"}</span>`}</p>`;
      }
    }
    if(q.type==="number"){
      const has = !blank(t[k]);
      body += `<div class="stepper">
        <button class="stepbtn" data-step="-1" data-q="${esc(q.id)}" ${edit?"":"disabled"} aria-label="Less">−</button>
        <span class="stepval ${has?"":"unset"}">${has? esc(t[k]) : esc(q.start)}</span>
        <button class="stepbtn" data-step="1" data-q="${esc(q.id)}" ${edit?"":"disabled"} aria-label="More">+</button>
        <span class="note" style="margin:0">${has? esc(q.unit||"") : (edit?"tap − or + to lock in a number":"no guess")}</span></div>`;
      if(showResults && !blank(actual) && !blank(my)){
        const off = Math.abs(Number(my)-Number(actual));
        body += `<p class="outcome">Actual: <strong>${esc(actual)}</strong> — you were ${off===0?"spot on":off+" out"}</p>`;
      } else if(showResults && !blank(actual)) body += `<p class="outcome">Actual: <strong>${esc(actual)}</strong></p>`;
    }
    if(q.type==="choice"){
      body += `<div class="chips">` + q.options.map(o=>`<button class="chip ${norm(t[k])===norm(o)?"picked":""}" data-choice="${esc(q.id)}" data-name="${esc(o)}" ${edit?"":"disabled"} aria-pressed="${norm(t[k])===norm(o)}">${esc(o)}</button>`).join("") + `</div>`;
      const fu = q.followUp;
      if(fu && fu.when.indexOf(t[k])!==-1){
        body += `<div class="followlabel">${esc(fu.label)}</div><input class="field" data-bonus="${esc(fu.key)}" list="rosterList" placeholder="Name them" value="${esc(t[fu.key]||"")}" ${edit?"":"disabled"}>`;
      }
      if(showResults && !blank(actual)){
        const hit = !blank(my) && norm(my)===norm(actual);
        if(!blank(my)) cls += hit?" correct":" wrong";
        const aWho = fu ? S.results[fu.key] : null;
        const whoHit = fu && !blank(aWho) && norm(mine[fu.key])===norm(aWho);
        body += `<p class="outcome">Answer: <strong>${esc(actual)}${blank(aWho)?"":" — "+esc(aWho)}</strong>${blank(my)?"":` — <span class="${hit?"hit":"miss"}">${hit ? (blank(aWho)?"you called it":(whoHit?"both right":"right call, wrong name")) : "missed"}</span>`}</p>`;
      }
    }
    if(others.length) body += whoPicked(others, k);
    return `<article class="${cls}"><h3>${esc(q.title)}</h3>${q.stip?`<p class="stip">${esc(q.stip)}</p>`:""}${botTag(k)}${body}</article>`;
  }

  function wireCard(el){
    wireLadders(el);
    const tog = $("#resToggle", el);
    if(tog) tog.addEventListener("click", ()=>{ flushSaves(); S.resultsMode = !S.resultsMode; renderAll(); });
    el.querySelectorAll(".opt").forEach(btn=>btn.addEventListener("click", ()=>{
      const t = target(), id = btn.dataset.bout, n = btn.dataset.name;
      t[id] = norm(t[id])===norm(n) ? null : n; changed();
    }));
    el.querySelectorAll("input[data-other], input[data-bonus]").forEach(inp=>{
      inp.addEventListener("change", ()=>{ const t = target(); t[inp.dataset.other || inp.dataset.bonus] = inp.value.trim() || null; changed(); });
      inp.addEventListener("blur", ()=>{ if(S.deferred){ S.deferred = false; setTimeout(renderAll, 0); } });
    });
    el.querySelectorAll(".stepbtn").forEach(btn=>btn.addEventListener("click", ()=>{
      const q = ev.bonus.find(x=>x.id===btn.dataset.q), k = bonusKey(q), t = target();
      const ok = fits(q, t[k]);
      t[k] = ok ? Math.min(q.max, Math.max(q.min, Number(t[k]) + Number(btn.dataset.step))) : q.start;
      changed();
    }));
    el.querySelectorAll(".chip[data-choice]").forEach(btn=>btn.addEventListener("click", ()=>{
      const q = ev.bonus.find(x=>x.id===btn.dataset.choice), k = bonusKey(q), t = target();
      t[k] = norm(t[k])===norm(btn.dataset.name) ? null : btn.dataset.name;
      if(q.followUp && q.followUp.when.indexOf(t[k])===-1) t[q.followUp.key] = null;
      changed();
    }));
    const bb = $("#botBtn", el);
    if(bb) bb.addEventListener("click", ()=>{
      if(!confirm("Throw away your own picks and use RyAI's card again?")) return;
      const t = myPicks(); Object.keys(t).forEach(k=>delete t[k]); changed();
    });
    const clr = $("#clearBtn", el);
    if(clr) clr.addEventListener("click", ()=>{
      if(!confirm("Clear every pick on your card?")) return;
      const t = target(); Object.keys(t).forEach(k=>delete t[k]); changed();
    });
  }

  // ── render: league table ──
  function renderTable(){
    const el = $("#panel-table"); if(!el || S.tab!=="table") return;
    const list = players();
    if(!list.length){ el.innerHTML = `<div class="empty">Nobody has filled in a card yet. Choose your name on the card tab and get picking.</div>`; return; }
    const anyResults = Object.keys(S.results).some(k=>!blank(S.results[k]));
    const table = standings(ev, list, S.results);
    if(!anyResults) table.sort((a,b)=>a.name.localeCompare(b.name));
    let html = "";
    if(S.final && S.final.winners && S.final.winners.length){
      const w = S.final.winners.map(k=>nameFor(k)).join(" & ");
      html += `<div class="winner"><h3>${esc(w)} ${S.final.winners.length>1?"share":"takes"} the swap token</h3>
        <p>${S.final.granted ? `Added to ${S.final.winners.length>1?"their teams":"the team"} in AEW Fantasy (${esc(S.final.league||"")}).` : "Couldn't reach the fantasy season — tap retry below."}</p>
        ${S.final.winners.length>1?`<p style="margin-top:6px">Level on points and on bonus points, so each gets one.</p>`:""}
        ${S.final.granted? `<button class="linkbtn" id="undoFinal">Results were wrong? Reopen and take the token back</button>` : `<button class="linkbtn" id="retryGrant">Retry sending the token</button>`}</div>`;
    }
    const tb = (ev.bonus||[]).length > 0;
    html += `<h2 class="section-head" style="margin-top:0">${anyResults? "League table" : "Who's filled in a card"}</h2>`;
    table.forEach((r,i)=>{
      const isLeague = LEAGUE_KEYS.indexOf(r.key)!==-1;
      html += `<div class="row ${anyResults&&i===0&&r.correct>0?"top":""}"><span class="rank">${anyResults? i+1 : "·"}</span>
        <span class="who">${avatar(r.key, r.name)}<span class="nm">${esc(r.name)}${r.bot?'<span class="bot">🤖 RyAI</span>':(r.mixed?'<span class="bot">🤖 + Ryan</span>':"")}${r.key===S.me?"<small>you</small>":""}${!isLeague?"<small>guest</small>":""}</span></span>
        ${anyResults? `<span class="sc">${r.correct}<span class="note" style="font-size:14px"> / ${r.graded}${tb?` · ${r.bonus} bonus`:""}</span></span>` : `<span class="meta">${r.answered} of ${totalQs(ev)}</span>`}</div>`;
    });
    if(anyResults && tb) html += `<p class="note">Level on points? Whoever got more bonus questions right wins the tie — on number questions, the closest guess counts as right. Still level, and each gets a token. Guests play for pride; the swap token only goes to a league member.</p>`;

    // finalise
    if(!S.legacy && !S.final && anyResults){
      const missing = ev.bouts.filter(b=>blank(S.results[b.id])).length;
      const winners = tokenWinners(standings(ev, list, S.results));
      html += `<div class="resultsmode-note" style="margin-top:16px">${missing
        ? `${missing} match${missing>1?"es":""} still need a result before this show can be finalised.`
        : `Every match has a result. Finalising locks the results and gives ${esc(winners.map(k=>nameFor(k)).join(" & ")||"nobody")} a swap token in AEW Fantasy.`}
        <div style="margin-top:10px"><button class="btn primary" id="finalBtn" ${missing||!winners.length?"disabled":""}>Finalise and award the token</button></div></div>`;
    }

    // compare + RyAI reasoning
    const others = table.filter(r=>r.key!==S.me);
    if(S.me && myPicks() && others.length){
      const sel = S.compareWith && others.some(o=>o.key===S.compareWith) ? S.compareWith : others[0].key;
      html += `<div class="compare"><div class="compare-head"><h2 class="section-head" style="margin:0">Where you differ</h2>
        <select id="cmpSel" aria-label="Compare with">${others.map(o=>`<option value="${esc(o.key)}" ${o.key===sel?"selected":""}>${esc(o.name)}</option>`).join("")}</select></div>`;
      const o = others.find(x=>x.key===sel), mp = myPicks();
      if(!locked() && !S.legacy && o.key!=="ryan") html += `<p class="note">You'll see their picks once the bell rings.</p>`;
      else {
        const rows = [];
        ev.bouts.forEach(b=>{ const a = mp[b.id], c = o.picks[b.id]; if(!blank(a)&&!blank(c)&&norm(a)!==norm(c)) rows.push([a, b.title, c]); });
        (ev.bonus||[]).forEach(q=>{
          const keys = [[bonusKey(q), q.title]]; if(q.followUp) keys.push([q.followUp.key, q.followUp.label]);
          keys.forEach(([k,l])=>{ const a = mp[k], c = o.picks[k]; if(!blank(a)&&!blank(c)&&norm(a)!==norm(c)) rows.push([a, l, c]); });
        });
        html += rows.length ? rows.map(r=>`<div class="diff"><span class="mine">${esc(r[0])}</span><span class="lbl">${esc(r[1])}</span><span class="theirs">${esc(r[2])}</span></div>`).join("")
          : `<p class="note">You agree on everything you've both called.</p>`;
      }
      html += `</div>`;
    }
    html += ryanSection();
    el.innerHTML = html;
    const cmp = $("#cmpSel", el); if(cmp) cmp.addEventListener("change", ()=>{ S.compareWith = cmp.value; renderTable(); });
    const fb = $("#finalBtn", el); if(fb) fb.addEventListener("click", finalise);
    const ub = $("#undoFinal", el); if(ub) ub.addEventListener("click", reopen);
    const rb = $("#retryGrant", el); if(rb) rb.addEventListener("click", ()=>grant(S.final));
  }

  function ryanSection(){
    if(S.legacy) return "";
    if(!S.ryan){
      return `<div class="reasons"><h2 class="section-head">Ryan's picks</h2><p class="note">${S.ryanErr==="not found"
        ? "RyAI hasn't filled in Ryan's card yet. It picks automatically a few hours before the show."
        : "Couldn't load Ryan's card right now."}</p></div>`;
    }
    const r = S.ryan, notes = r.notes || {}, p = r.picks || {};
    const late = r.generatedAt && new Date(r.generatedAt).getTime() > S.start;
    const own = ryanOwn(), changedKeys = ryanChanged();
    const ownLine = k => changedKeys.indexOf(k)!==-1 ? `<div class="why" style="font-style:normal">Ryan changed it to <b>${esc(own[k])}</b></div>` : "";
    // Questions RyAI hasn't answered, or answered with something no longer on the card
    const owed = [];
    ev.bouts.forEach(b=>{ const v = p[b.id]; if(blank(v) || (!b.allowOther && !b.options.some(o=>norm(o.n)===norm(v)))) owed.push(b.title); });
    (ev.bonus||[]).forEach(q=>{
      const k = bonusKey(q), v = p[k];
      const bad = blank(v) || (q.type==="choice" && (q.options||[]).indexOf(v)===-1) || (q.type==="number" && (Number(v)<q.min || Number(v)>q.max));
      if(bad) owed.push(q.title);
    });
    let html = `<div class="reasons"><h2 class="section-head">Ryan's picks <span class="bot">🤖 RyAI</span></h2>
      <p class="note">${esc(r.persona || "Picked by RyAI as a casual WWE watcher who skims the headlines.")} Sealed ${esc(fmtDate(r.generatedAt,{weekday:"short",hour:"numeric",minute:"2-digit"}))}${late?" — after the bell, so it shouldn't count":""}.</p>`;
    if(owed.length && !locked()) html += `<p class="resultsmode-note">RyAI hasn't answered ${owed.length===1?"one question":owed.length+" questions"} on the current card (${esc(owed.join("; "))}). Ask Claude to run RyAI to fill ${owed.length===1?"it":"them"} in.</p>`;
    ev.bouts.forEach(b=>{ html += `<div class="reason"><div class="q">${esc(b.title)}</div><div class="a">${esc(p[b.id]||"—")}</div>${notes[b.id]?`<div class="why">“${esc(notes[b.id])}”</div>`:""}${ownLine(b.id)}</div>`; });
    (ev.bonus||[]).forEach(q=>{
      const k = bonusKey(q); let a = blank(p[k]) ? "—" : p[k] + (q.unit && q.type==="number" ? " "+q.unit : "");
      if(q.followUp && !blank(p[q.followUp.key])) a += " — " + p[q.followUp.key];
      html += `<div class="reason"><div class="q">${esc(q.title)}</div><div class="a">${esc(a)}</div>${notes[k]?`<div class="why">“${esc(notes[k])}”</div>`:""}${ownLine(k)}</div>`;
    });
    return html + `</div>`;
  }

  function renderParty(){
    const sec = $("#panel-party"); if(!sec) return;
    const live = partyLive();
    sec.classList.toggle("hidden", !live);
    const tabs = app.querySelector(".tabs"); if(tabs) tabs.classList.toggle("hidden", live);
    $("#panel-card").classList.toggle("hidden", live || S.tab!=="card");
    $("#panel-table").classList.toggle("hidden", live || S.tab!=="table");
    if(!live){ S.partyShell = ""; return; }
    const P = S.party, r = pRound(), R = ROUNDS[r];
    const joined = !!(S.me && P.players && P.players[S.me]);
    const key = [S.me, joined, r].join("|");
    if(key!==S.partyShell){
      S.partyShell = key;
      let head;
      if(!S.me) head = `<h2>Party picks are on</h2><p>Tap your face above to play along.</p>`;
      else if(!joined) head = `<h2>Party picks are on</h2><p>One match at a time, revealed on the TV.</p><button class="btn primary" id="pJoin">I'm playing</button>`;
      else if(r<0 || !R) head = `<h2>You're in</h2><p>Waiting for everyone to join. The first match starts from the TV.</p>`;
      else head = `<p class="pk">${R.kind==="bout" ? `Match ${r+1} of ${ev.bouts.length}` : "Bonus round"}</p>`;
      sec.innerHTML = `<div class="party-head">${head}</div>${joined && R ? `<div id="partyBody"></div>` : ""}<div id="partyFoot"></div>`;
      const jb = $("#pJoin", sec);
      if(jb) jb.addEventListener("click", async ()=>{
        jb.disabled = true;
        try{ await withinMs(db.ref(base+"/party/players/"+S.me).set({ name: (S.picks[S.me] && S.picks[S.me].name) || nameFor(S.me), at: firebase.database.ServerValue.TIMESTAMP }), 10000); }
        catch(err){ jb.disabled = false; toast("Couldn't join: " + err.message); }
      });
    }
    const foot = $("#partyFoot", sec); if(!foot) return;
    if(!joined || !R){ foot.innerHTML = ""; return; }
    const waiting = pJoined().filter(k=>!pLocks()[k]).map(k=>nameFor(k, P.players[k]));
    if(pRevealed()) foot.innerHTML = `<div class="lockbar done"><b>Picks are up on the TV 👀</b><span>The next ${r+1 < ROUNDS.length ? "match" : "round"} opens in a moment.</span></div>`;
    else if(myLock()) foot.innerHTML = `<div class="lockbar done"><b>✓ Locked in</b><span>${waiting.length ? "Waiting on " + esc(waiting.join(", ")) : "Revealing…"}</span>
      <button class="linkbtn" id="pUnlock">Change my pick</button></div>`;
    else {
      const ok = roundDone();
      foot.innerHTML = `<div class="lockbar"><button class="btn primary" id="pLock" ${ok?"":"disabled"}>Lock in</button>
        <span>${ok ? "Happy with that? Nobody sees it until everyone's in." : R.kind==="bout" ? "Pick a winner." : "Answer every question to lock in."}</span></div>`;
    }
    const lb = $("#pLock", foot);
    if(lb) lb.addEventListener("click", async ()=>{
      lb.disabled = true;
      flushSaves();
      try{ await withinMs(db.ref(base+"/party/locks/"+r+"/"+S.me).set(true), 10000); }
      catch(err){ lb.disabled = false; toast("Couldn't lock in: " + err.message); }
    });
    const ub = $("#pUnlock", foot);
    if(ub) ub.addEventListener("click", ()=>{ db.ref(base+"/party/locks/"+r+"/"+S.me).remove().catch(err=>toast(err.message)); });
  }

  function renderAll(){
    if(S.dead) return;
    renderLock(); renderWho(); renderParty(); renderCard(); renderTable();
  }

  // ── saving ──
  function changed(){
    if(S.resultsMode){
      S.pendingResults = true; clearTimeout(S.resultsTimer); S.resultsTimer = setTimeout(saveResults, 500);
    } else {
      S.pendingMine = S.me; clearTimeout(S.saveTimer); S.saveTimer = setTimeout(saveMine, 600);
    }
    renderAll();
  }
  function clean(o){ const r = {}; Object.keys(o||{}).forEach(k=>{ if(!blank(o[k])) r[k] = o[k]; }); return r; }
  async function saveMine(){
    const who = S.pendingMine; S.pendingMine = null;
    if(!who || !db) return;
    if(locked()){ toast("Picks are locked — the bell has rung."); return; }
    const e = S.picks[who];
    let out = clean(e.picks);
    // Ryan's saved card holds only where he differs from RyAI, so RyAI can still fill in new questions.
    if(who==="ryan"){ const b = botPicks(); Object.keys(out).forEach(k=>{ if(norm(out[k])===norm(b[k])) delete out[k]; }); }
    try{
      await withinMs(db.ref(base+"/picks/"+who).set({ name:e.name || nameFor(who), picks:out, updatedAt:firebase.database.ServerValue.TIMESTAMP }), 10000);
    }catch(err){ toast("Your picks didn't save: " + err.message); }
  }
  async function saveResults(){
    S.pendingResults = null;
    if(!db) return;
    try{ await withinMs(db.ref(base+"/results").set(clean(S.results)), 10000); }
    catch(err){ toast("Results didn't save: " + err.message); }
  }
  function flushSaves(){
    if(S.pendingMine){ clearTimeout(S.saveTimer); saveMine(); }
    if(S.pendingResults){ clearTimeout(S.resultsTimer); saveResults(); }
  }

  // ── finalise + award ──
  async function finalise(){
    flushSaves();
    const table = standings(ev, players(), S.results);
    const winners = tokenWinners(table);
    if(!winners.length) return;
    const names = winners.map(k=>nameFor(k)).join(" & ");
    const scores = {}; table.forEach(r=>{ scores[r.key] = r.correct + "/" + r.graded; });
    const ok = await confirmDialog(`Give ${names} the swap token?`,
      `${names} ${winners.length>1?"are level":"called the most"} with ${esc(scores[winners[0]])}. This locks the results and adds a swap token to ${winners.length>1?"each of their teams":"their team"} in AEW Fantasy.`,
      "Award the token");
    if(!ok) return;
    const final = { at: Date.now(), by: S.me || "someone", winners, scores, results: clean(S.results), granted:false };
    try{
      const res = await withinMs(db.ref(base+"/final").transaction(cur => cur ? undefined : final), 10000);
      if(!res.committed){ toast("Someone else just finalised this show."); return; }
    }catch(err){ toast("Couldn't finalise: " + err.message); return; }
    S.resultsMode = false;
    await grant(final);
  }

  function swapsShape(raw){
    let v = raw;
    try{ if(typeof v==="string") v = JSON.parse(v); if(typeof v==="string") v = JSON.parse(v); }catch(e){ v = null; }
    if(!v || typeof v!=="object") v = {};
    if(!v.tokens || typeof v.tokens!=="object") v.tokens = { maria:0, ryan:0, josh:0, erik:0 };
    if(!Array.isArray(v.history)) v.history = v.history ? Object.values(v.history) : [];
    if(!Array.isArray(v.awards)) v.awards = v.awards ? Object.values(v.awards) : [];
    return v;
  }
  async function grant(final){
    try{
      const league = (await withinMs(db.ref("currentLeague").once("value"), 10000)).val();
      if(!league) throw new Error("the fantasy app has no current season set");
      const label = ev.name + (ev.subtitle? " " + ev.subtitle : "");
      await withinMs(db.ref("leagues/"+league+"/data/aew_swaps").transaction(cur=>{
        const sw = swapsShape(cur);
        final.winners.forEach(team=>{
          const id = ev.id + ":" + team;
          if(sw.awards.some(a=>a && a.id===id)) return;
          sw.tokens[team] = (Number(sw.tokens[team])||0) + 1;
          sw.awards.push({ id, team, event: label, eventId: ev.id, score: final.scores[team] || "", date: shortDate(ev.start), at: Date.now() });
        });
        return JSON.stringify(sw);
      }), 15000);
      await withinMs(db.ref(base+"/final").update({ granted:true, league }), 10000);
      toast("Swap token sent to AEW Fantasy.");
    }catch(err){
      toast("The show is final, but the token didn't send: " + err.message);
    }
  }

  async function reopen(){
    const ok = await confirmDialog("Reopen the results?",
      "This takes back the swap token this show gave out (if it hasn't been spent) and unlocks the results for editing.", "Reopen");
    if(!ok) return;
    const f = S.final;
    try{
      if(f && f.league){
        let spent = [];
        await withinMs(db.ref("leagues/"+f.league+"/data/aew_swaps").transaction(cur=>{
          const sw = swapsShape(cur); spent = [];
          (f.winners||[]).forEach(team=>{
            const id = ev.id + ":" + team, i = sw.awards.findIndex(a=>a && a.id===id);
            if(i===-1) return;
            sw.awards.splice(i,1);
            if((Number(sw.tokens[team])||0) > 0) sw.tokens[team] = Number(sw.tokens[team]) - 1; else spent.push(team);
          });
          return JSON.stringify(sw);
        }), 15000);
        if(spent.length) toast(spent.map(k=>nameFor(k)).join(" & ") + " already used the token — sort that one out in the fantasy app.");
      }
      await withinMs(db.ref(base+"/final").remove(), 10000);
      S.tab = "card"; S.resultsMode = true;
      document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected", String(x.dataset.tab==="card")));
      $("#panel-card").classList.remove("hidden"); $("#panel-table").classList.add("hidden");
      renderAll();
    }catch(err){ toast("Couldn't reopen: " + err.message); }
  }

  // ── data ──
  renderAll();
  S.tick = setInterval(()=>{ renderLock(); if(locked() && !S.wasLocked){ S.wasLocked = true; renderAll(); } }, 20000);
  S.wasLocked = locked();

  if(S.legacy){
    try{
      const data = await getJSON(ev.legacySheet);
      const parts = (data && data.participants) || [];
      parts.forEach(p=>{
        if(p.name==="__RESULTS__"){ S.results = p.picks || {}; return; }
        const k = LEAGUE_KEYS.indexOf(slug(p.name))!==-1 ? slug(p.name) : "g_"+slug(p.name);
        S.picks[k] = { name:p.name, picks:p.picks||{} };
      });
      S.tab = "table";
      document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected", String(x.dataset.tab==="table")));
      $("#panel-card").classList.add("hidden"); $("#panel-table").classList.remove("hidden");
    }catch(e){ toast("Couldn't read the old sheet: " + e.message); }
    renderAll();
    return;
  }

  getJSON("picks/"+ev.id+"/ryan.json").then(r=>{ S.ryan = r; renderAll(); }).catch(e=>{ S.ryanErr = e.message; renderAll(); });

  try{
    await initDb();
    if(S.dead) return;
    // The card itself can change on the setup page mid-show: redraw with the new one.
    S.cardRef = db.ref(CARD_PATH+"/"+ev.id);
    S.cardRef.on("value", snap=>{
      const d = parseDef(snap.val());
      if(!d || d.deleted) return;
      if(!d.id) d.id = ev.id;
      if(JSON.stringify(d)===evStr) return;
      CARD_CACHE[ev.id] = d;
      const carryOn = { tab:S.tab, resultsMode:S.resultsMode };
      if(view && view.teardown) view.teardown();
      view = null;
      showEvent(ev.id, carryOn);
    });
    S.ref = db.ref(base);
    S.ref.on("value", snap=>{
      const v = snap.val() || {};
      const incoming = v.picks || {};
      // Keep this device's unsaved edits; take everything else from the server.
      Object.keys(incoming).forEach(k=>{ if(k===S.pendingMine) return; S.picks[k] = incoming[k]; if(S.picks[k] && !S.picks[k].picks) S.picks[k].picks = {}; });
      if(!S.pendingResults) S.results = v.results || {};
      S.final = v.final || null;
      S.party = v.party || null;
      if(S.final) S.final.winners = arrayOf(S.final.winners);
      if(S.final) S.resultsMode = false;
      renderAll();
    }, err=>toast("Can't read picks: " + err.message));
  }catch(e){
    toast("Can't reach the database — picks won't save until it's back. " + e.message);
  }
}

// ════════════════════════════════════════════════════════════════════════════
// Setup — shows, matches, entrants, bonus questions and player photos.
// Saves go to Firebase (CARD_PATH), so changes reach everyone instantly; a copy
// goes to PUBLIC_CARD_PATH so RyAI can read the card without signing in.
// ════════════════════════════════════════════════════════════════════════════
function pad2(n){ return String(n).padStart(2,"0"); }
function toLocalInput(iso){
  const d = new Date(iso); if(isNaN(d)) return "";
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function fromLocalInput(v){
  const d = new Date(v); if(!v || isNaN(d)) return "";
  const off = -d.getTimezoneOffset(), sg = off>=0 ? "+" : "-", a = Math.abs(off);
  return `${v.length===16 ? v+":00" : v}${sg}${pad2(Math.floor(a/60))}:${pad2(a%60)}`;
}
function uniqueId(base, taken){ let id = base || "item", n = 2; while(taken.indexOf(id)!==-1) id = base + "-" + n++; return id; }
function getPath(o, path){ return path.split(".").reduce((a,k)=>a==null?a:a[k], o); }
function setPath(o, path, v){ const ks = path.split("."), last = ks.pop(); const t = ks.reduce((a,k)=>a[k], o); t[last] = v; }

async function resizePhoto(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = ()=>rej(new Error("That file isn't an image the browser can read.")); i.src = url; });
    const S = 256, c = document.createElement("canvas"); c.width = c.height = S;
    const side = Math.min(img.naturalWidth, img.naturalHeight);
    c.getContext("2d").drawImage(img, (img.naturalWidth-side)/2, (img.naturalHeight-side)/2, side, side, 0, 0, S, S);
    return c.toDataURL("image/jpeg", 0.82);
  } finally { URL.revokeObjectURL(url); }
}

async function showSetup(id){
  document.body.dataset.theme = "ringside";
  document.title = "Setup — Prediction Sheet";
  $("#homeLink").classList.remove("hidden");
  const app = $("#app");
  if(!id){ return setupHome(app); }
  return setupEditor(app, id);
}

async function setupHome(app){
  app.innerHTML = `<div class="setup">

    <p><a class="btn primary" href="#/setup/new" style="text-decoration:none;display:inline-block">Add a show</a></p>

  const paintPlayers = ()=>{
